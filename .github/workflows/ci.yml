name: CI

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  workflow_dispatch:
  schedule:
    # A nightly integration gate on the default branch.
    - cron: "17 3 * * *"

# A newer push to the same branch or pull request supersedes the older run.
# Runs on main are never cancelled, so the default branch always finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  go:
    name: Go lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.14.10"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned kubectl
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output kubectl
          curl --fail --silent --show-error --location "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" --output kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check --status
          chmod +x kubectl
          sudo install kubectl /usr/local/bin/kubectl
      - run: make lint-go
      - run: make test-go
      - run: make test-eval
      - run: make eval-table-check

  agent:
    name: Agent lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - run: make lint-agent
      - run: make test-agent

  dashboard:
    name: Dashboard typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: make dashboard-check
      - run: make dashboard-build

  prompts:
    name: Prompt-injection suite (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: evals/prompts/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.14.10"
      - run: make prompts-check

  manifests:
    name: Manifest validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Helm and kubeconform
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output helm.tar.gz
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" --output helm.sha256sum
          echo "$(awk '{print $1}' helm.sha256sum)  helm.tar.gz" | sha256sum --check --status
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
          curl --fail --silent --show-error --location \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output kubeconform.tar.gz
          echo "${KUBECONFORM_LINUX_AMD64_SHA256}  kubeconform.tar.gz" | sha256sum --check --status
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output kubectl
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" --output kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check --status
          chmod +x kubectl
          sudo install kubectl /usr/local/bin/kubectl
      - run: make validate

  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Scheduled and manually dispatched runs always execute the end-to-end job.
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A push compares with the commit it replaces; a pull request compares with
      # its base branch through the GitHub API.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  e2e:
    name: Credential-free kind integration
    # The kind cluster is the integration gate, so it runs only for pull requests
    # and pushes that feed an integration branch, plus the nightly and manual runs.
    # Documentation, ADR and Markdown changes need only the fast jobs.
    needs: [changes]
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integration/')) &&
        needs.changes.outputs.code == 'true') ||
      (github.event_name == 'pull_request' &&
        (github.base_ref == 'main' || startsWith(github.base_ref, 'integration/')) &&
        needs.changes.outputs.code == 'true')
    runs-on: ubuntu-24.04
    # The three-Scenario Replay subset runs one five-minute Verification window
    # per Scenario after a ten-to-fifteen-minute stack setup, so a measured run of
    # the whole subset needs about forty minutes. The bound stays well below the
    # six-hour default, so a stalled step still fails the job instead of hanging.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.14.10"
      - name: Install pinned Kubernetes tools
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" --output kind
          chmod +x kind
          sudo install kind /usr/local/bin/kind
          curl --fail --silent --show-error --location "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output kubectl
          chmod +x kubectl
          sudo install kubectl /usr/local/bin/kubectl
          curl --fail --silent --show-error --location "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output helm.tar.gz
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Run the three-Scenario Replay evaluation
        env:
          PAGERLESS_E2E_DIAGNOSTICS: ${{ github.workspace }}/e2e-diagnostics
        run: make eval-replay
      - name: Upload end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics
          path: e2e-diagnostics
          if-no-files-found: ignore

  publish-images:
    name: Publish versioned runtime images
    needs: [go, agent]
    if: startsWith(github.ref, 'refs/tags/v') && needs.go.result == 'success' && needs.agent.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and publish GHCR images
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${IMAGE_TAG#v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --file Dockerfile.pagerless-server --build-arg "VERSION=$tag" --build-arg "VCS_REF=$GITHUB_SHA" --tag "ghcr.io/a-hagi613/pagerless-server:$tag" .
          docker build --file Dockerfile.pagerless-executor --build-arg "VERSION=$tag" --build-arg "VCS_REF=$GITHUB_SHA" --tag "ghcr.io/a-hagi613/pagerless-executor:$tag" .
          docker build --file Dockerfile.pagerless-agent --build-arg "VERSION=$tag" --build-arg "VCS_REF=$GITHUB_SHA" --tag "ghcr.io/a-hagi613/pagerless-agent:$tag" .
          docker push "ghcr.io/a-hagi613/pagerless-server:$tag"
          docker push "ghcr.io/a-hagi613/pagerless-executor:$tag"
          docker push "ghcr.io/a-hagi613/pagerless-agent:$tag"
