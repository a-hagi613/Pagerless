name: CI

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the older run.
# Runs on main are never cancelled, so the default branch always finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  go:
    name: Go lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.14.10"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned kubectl and Helm
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output kubectl
          curl --fail --silent --show-error --location "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" --output kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check --status
          chmod +x kubectl
          sudo install kubectl /usr/local/bin/kubectl
          # The envtest harness renders charts/pagerless, so the chart's template
          # functions are exercised by the Go suite as well.
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output helm.tar.gz
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" --output helm.sha256sum
          echo "$(awk '{print $1}' helm.sha256sum)  helm.tar.gz" | sha256sum --check --status
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
      - run: make lint-go
      - run: make test-go

  agent:
    name: Agent lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - run: make lint-agent
      - run: make test-agent

  dashboard:
    name: Dashboard typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: make dashboard-check
      - run: make dashboard-build

  manifests:
    name: Manifest validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Helm, kubeconform, and kubectl
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output helm.tar.gz
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" --output helm.sha256sum
          echo "$(awk '{print $1}' helm.sha256sum)  helm.tar.gz" | sha256sum --check --status
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
          curl --fail --silent --show-error --location \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output kubeconform.tar.gz
          echo "${KUBECONFORM_LINUX_AMD64_SHA256}  kubeconform.tar.gz" | sha256sum --check --status
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output kubectl
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" --output kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check --status
          chmod +x kubectl
          sudo install kubectl /usr/local/bin/kubectl
      - run: make validate

  kind:
    name: Chart and read-only grant on kind
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Helm, kind, and kubectl
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output helm.tar.gz
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" --output helm.sha256sum
          echo "$(awk '{print $1}' helm.sha256sum)  helm.tar.gz" | sha256sum --check --status
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
          curl --fail --silent --show-error --location \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" --output kind
          echo "${KIND_LINUX_AMD64_SHA256}  kind" | sha256sum --check --status
          chmod +x kind
          sudo install kind /usr/local/bin/kind
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output kubectl
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" --output kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check --status
          chmod +x kubectl
          sudo install kubectl /usr/local/bin/kubectl
      - run: make verify-chart

  release:
    name: Release configuration and snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint the release scripts
        run: shellcheck -x scripts/release/*.sh
      - name: Validate the GoReleaser configuration and the Krew manifest
        run: make release-check
      - name: Build the snapshot archives, checksums, SBOMs, and manifest
        run: make release-snapshot
      - name: Check the snapshot inventory
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name 'kubectl-page_*.tar.gz' | wc -l)" = "4"
          test "$(find dist -maxdepth 1 -name '*.tar.gz.sbom.json' | wc -l)" = "4"
          test -f dist/checksums.txt
          test -f dist/plugins/page.yaml
