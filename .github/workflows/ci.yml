name: CI

# A pull request runs once. Pushing to the pull-request head does not start a
# second copy: the pull_request event already covers it. Pushes to the default
# branch, the integration branch, integration candidates and tags are verified
# explicitly.
on:
  # Every pull request is eligible, whatever base it targets. A push to a
  # feature head does not start a second copy: the pull_request event covers it.
  pull_request:
  push:
    branches:
      - main
      - a-hagi613/overhaul-simplify-project-scope
      - "integration/**"
      - "combined/**"
    tags:
      # Only the fresh immutable release tag. The legacy v-prefixed tags are
      # frozen history and must not start any automation.
      - "pagerless-v*.*.*"
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the older run,
# including main and integration candidates. Tag verification keeps its run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  go-lint:
    name: Go lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint-go

  go-test:
    name: Go test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The Go suite uses fake MCP and GitHub endpoints over localhost. It needs
      # no cluster, kubectl, Helm, or envtest.
      - run: make test-go

  agent:
    name: Agent lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: make lint-agent
      - run: make test-agent

  dashboard:
    name: Dashboard typecheck, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: make dashboard-check
      - run: make dashboard-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 2

  manifests:
    name: Helm lint, render, and schema
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Helm, kubeconform, and jq
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output helm.tar.gz
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" --output helm.sha256sum
          echo "$(awk '{print $1}' helm.sha256sum)  helm.tar.gz" | sha256sum --check --status
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
          curl --fail --silent --show-error --location \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output kubeconform.tar.gz
          echo "${KUBECONFORM_LINUX_AMD64_SHA256}  kubeconform.tar.gz" | sha256sum --check --status
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - run: make validate

  kind:
    name: Packaged kind integration (chat, CLI, RBAC, PR)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install pinned Helm, kind, and kubectl
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output helm.tar.gz
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" --output helm.sha256sum
          echo "$(awk '{print $1}' helm.sha256sum)  helm.tar.gz" | sha256sum --check --status
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
          curl --fail --silent --show-error --location \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" --output kind
          echo "${KIND_LINUX_AMD64_SHA256}  kind" | sha256sum --check --status
          chmod +x kind
          sudo install kind /usr/local/bin/kind
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output kubectl
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" --output kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check --status
          chmod +x kubectl
          sudo install kubectl /usr/local/bin/kubectl
      - name: Install the dashboard browser dependencies
        run: |
          set -euo pipefail
          cd dashboard
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the packaged integration
        env:
          PAGERLESS_E2E_BROWSER: "1"
        run: make verify-chart

  release:
    name: Release configuration and snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint the release scripts
        run: shellcheck -x scripts/release/*.sh
      - name: Run the release preflight
        run: make release-preflight
      - name: Check the snapshot inventory
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name 'kubectl-page_*.tar.gz' | wc -l)" = "4"
          test "$(find dist -maxdepth 1 -name '*.tar.gz.sbom.json' | wc -l)" = "4"
          test -f dist/checksums.txt
          test -f dist/plugins/page.yaml

  links:
    name: Markdown links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make check-links

  # One stable required status. It reports every failed, cancelled, or
  # unexpectedly skipped job instead of trusting the first failure.
  ci:
    name: CI
    if: always()
    needs: [go-lint, go-test, agent, dashboard, manifests, kind, release, links]
    runs-on: ubuntu-24.04
    steps:
      - name: Report every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          failed = []
          lines = ["| job | result |", "| --- | --- |"]
          for name in sorted(results):
              result = results[name]["result"]
              lines.append(f"| {name} | {result} |")
              if result != "success":
                  failed.append(f"{name}={result}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          if failed:
              print("required job(s) did not pass: " + ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          print("every required job passed")
          PY
