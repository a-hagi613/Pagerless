name: CI

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the older run.
# Runs on main are never cancelled, so the default branch always finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  go-lint:
    name: Go lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Lint reads the source only: it needs neither kubectl, Helm, nor a
      # cluster. Splitting it from the test job keeps the two in parallel so the
      # pipeline waits for the slower one, not for their sum.
      - run: make lint-go

  go-test:
    name: Go test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.14.10"
          # This job runs no uv command, so a cache miss would leave no directory to
          # save and fail the post step whenever agent/uv.lock changes.
          enable-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned kubectl and Helm
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output kubectl
          curl --fail --silent --show-error --location "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" --output kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check --status
          chmod +x kubectl
          sudo install kubectl /usr/local/bin/kubectl
          # The envtest harness renders charts/pagerless, so the chart's template
          # functions are exercised by the Go suite as well.
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output helm.tar.gz
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" --output helm.sha256sum
          echo "$(awk '{print $1}' helm.sha256sum)  helm.tar.gz" | sha256sum --check --status
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
      - run: make test-go

  agent:
    name: Agent lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - run: make lint-agent
      - run: make test-agent

  dashboard:
    name: Dashboard typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: make dashboard-check
      - run: make dashboard-build

  manifests:
    name: Manifest validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Helm, kubeconform, and kubectl
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output helm.tar.gz
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" --output helm.sha256sum
          echo "$(awk '{print $1}' helm.sha256sum)  helm.tar.gz" | sha256sum --check --status
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
          curl --fail --silent --show-error --location \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output kubeconform.tar.gz
          echo "${KUBECONFORM_LINUX_AMD64_SHA256}  kubeconform.tar.gz" | sha256sum --check --status
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output kubectl
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" --output kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check --status
          chmod +x kubectl
          sudo install kubectl /usr/local/bin/kubectl
      - run: make validate

  kind:
    name: Chart, read-only grant, and decision parity on kind
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned Helm, kind, and kubectl
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output helm.tar.gz
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" --output helm.sha256sum
          echo "$(awk '{print $1}' helm.sha256sum)  helm.tar.gz" | sha256sum --check --status
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
          curl --fail --silent --show-error --location \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" --output kind
          echo "${KIND_LINUX_AMD64_SHA256}  kind" | sha256sum --check --status
          chmod +x kind
          sudo install kind /usr/local/bin/kind
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output kubectl
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" --output kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check --status
          chmod +x kubectl
          sudo install kubectl /usr/local/bin/kubectl
      - run: make verify-chart

  release:
    name: Release configuration and snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint the release scripts
        run: shellcheck -x scripts/release/*.sh
      # The same command a release runs locally before the tag. Keeping one
      # command means CI cannot check a different set from the one an operator
      # relies on, and a drift between them shows up here rather than at a tag.
      - name: Run the release preflight
        run: make release-preflight
      - name: Check the snapshot inventory
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name 'kubectl-page_*.tar.gz' | wc -l)" = "4"
          test "$(find dist -maxdepth 1 -name '*.tar.gz.sbom.json' | wc -l)" = "4"
          test -f dist/checksums.txt
          test -f dist/plugins/page.yaml

  links:
    name: Markdown links
    runs-on: ubuntu-24.04
    # Shell, git, and coreutils only: the check never fetches an external URL,
    # so it needs no network beyond the checkout.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make check-links

  portal:
    name: Portal browser suite
    runs-on: ubuntu-24.04
    # Builds the dashboard, downloads the pinned envtest assets, starts the real
    # server, and runs the Playwright suite once per viewport. The browser
    # download and the two server startups dominate the wall clock.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install pinned Helm
        # The envtest harness renders charts/pagerless with `helm template`, so
        # the same pinned Helm the Go job installs is required here. `make
        # portal-e2e` sets KUBEBUILDER_ASSETS through `go tool setup-envtest`
        # itself, the same mechanism `make test-go` uses.
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output helm.tar.gz
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" --output helm.sha256sum
          echo "$(awk '{print $1}' helm.sha256sum)  helm.tar.gz" | sha256sum --check --status
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Install the dashboard dependencies and the Chromium browser
        # The Playwright version is the one dashboard/package-lock.json pins, so
        # the browser is installed after npm ci. `make portal-e2e` runs npm ci
        # again through dashboard-build; this step only makes node_modules and
        # the matching Chromium build present before the suite starts.
        run: |
          set -euo pipefail
          cd dashboard
          npm ci
          npx playwright install --with-deps chromium
      - run: make portal-e2e
