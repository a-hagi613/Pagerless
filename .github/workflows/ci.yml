name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  go:
    name: Go lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.14.10"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned kubectl
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output kubectl
          curl --fail --silent --show-error --location "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" --output kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check --status
          chmod +x kubectl
          sudo install kubectl /usr/local/bin/kubectl
      - run: make lint-go
      - run: make test-go

  agent:
    name: Agent lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - run: make lint-agent
      - run: make test-agent

  dashboard:
    name: Dashboard typecheck and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: make dashboard-check
      - run: make dashboard-build

  manifests:
    name: Manifest validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Helm and kubeconform
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output helm.tar.gz
          curl --fail --silent --show-error --location \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" --output helm.sha256sum
          echo "$(awk '{print $1}' helm.sha256sum)  helm.tar.gz" | sha256sum --check --status
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
          curl --fail --silent --show-error --location \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output kubeconform.tar.gz
          echo "${KUBECONFORM_LINUX_AMD64_SHA256}  kubeconform.tar.gz" | sha256sum --check --status
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output kubectl
          curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" --output kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check --status
          chmod +x kubectl
          sudo install kubectl /usr/local/bin/kubectl
      - run: make validate

  e2e:
    name: Credential-free kind integration
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.14.10"
      - name: Install pinned Kubernetes tools
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" --output kind
          chmod +x kind
          sudo install kind /usr/local/bin/kind
          curl --fail --silent --show-error --location "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output kubectl
          chmod +x kubectl
          sudo install kubectl /usr/local/bin/kubectl
          curl --fail --silent --show-error --location "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output helm.tar.gz
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Run the adapter-backed Replay scenario
        run: make e2e

  publish-images:
    name: Publish versioned runtime images
    needs: [go, agent]
    if: startsWith(github.ref, 'refs/tags/v') && needs.go.result == 'success' && needs.agent.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and publish GHCR images
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${IMAGE_TAG#v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --file Dockerfile.pagerless-server --build-arg "VERSION=$tag" --build-arg "VCS_REF=$GITHUB_SHA" --tag "ghcr.io/a-hagi613/pagerless-server:$tag" .
          docker build --file Dockerfile.pagerless-executor --build-arg "VERSION=$tag" --build-arg "VCS_REF=$GITHUB_SHA" --tag "ghcr.io/a-hagi613/pagerless-executor:$tag" .
          docker build --file Dockerfile.pagerless-agent --build-arg "VERSION=$tag" --build-arg "VCS_REF=$GITHUB_SHA" --tag "ghcr.io/a-hagi613/pagerless-agent:$tag" .
          docker push "ghcr.io/a-hagi613/pagerless-server:$tag"
          docker push "ghcr.io/a-hagi613/pagerless-executor:$tag"
          docker push "ghcr.io/a-hagi613/pagerless-agent:$tag"
