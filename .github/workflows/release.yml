name: Release

# A tag builds and proves every artifact, then a separately approved job
# publishes them. No job creates a tag, merges a pull request, or rewrites an
# existing release. Public distribution coordinates are frozen until the owner
# approves fresh ones.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v; the tree must already carry it
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate the tag against the tree
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          case "$version" in
          '' | *[!0-9.]*) echo "the version is not a release version" >&2; exit 1 ;;
          esac
          echo "version=${version}" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version wiring
        run: bash scripts/release/check-versions.sh --version "${{ steps.version.outputs.version }}"
      - name: Lint the release scripts
        run: shellcheck -x scripts/release/*.sh

  verify:
    name: Build and verify every artifact
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the local release preflight
        run: make release-preflight
      - name: Build the images without pushing
        run: |
          set -euo pipefail
          docker build --file Dockerfile.pagerless-server \
            --build-arg "VERSION=${{ needs.validate.outputs.version }}" \
            --tag "pagerless-server:${{ needs.validate.outputs.version }}" .
          docker build --file Dockerfile.pagerless-agent \
            --build-arg "VERSION=${{ needs.validate.outputs.version }}" \
            --tag "pagerless-agent:${{ needs.validate.outputs.version }}" .
      - name: Package the chart
        run: |
          set -euo pipefail
          mkdir -p dist/chart
          helm package charts/pagerless --destination dist/chart
      - name: Record the artifact inventory
        run: |
          set -euo pipefail
          find dist -type f -maxdepth 3 -printf '%P %s bytes\n' | sort
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts-${{ needs.validate.outputs.version }}
          path: dist
          retention-days: 7

  publish:
    name: Publish approved artifacts
    needs: [validate, verify]
    # Publication waits for a human approval on the release environment. The
    # job creates no tag and merges nothing.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the images
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --file Dockerfile.pagerless-server --build-arg "VERSION=${version}" \
            --tag "ghcr.io/a-hagi613/pagerless-server:${version}" .
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --file Dockerfile.pagerless-agent --build-arg "VERSION=${version}" \
            --tag "ghcr.io/a-hagi613/pagerless-agent:${version}" .
      - name: Publish the chart
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          helm package charts/pagerless --destination dist/chart
          helm push "dist/chart/pagerless-${version}.tgz" oci://ghcr.io/a-hagi613/charts
      - name: Publish the CLI archives, checksums, and SBOMs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KREW_SKIP_UPLOAD: "true"
          KREW_BRANCH: page-${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          make release-tools
          PATH="${PWD}/bin/release-tools:${PATH}" goreleaser release --clean
      - name: Verify the published checksums and artifacts
        run: |
          set -euo pipefail
          bash scripts/release/verify-artifacts.sh \
            --version "${{ needs.validate.outputs.version }}" \
            --checksums dist/checksums.txt --dist dist --skip-krew
