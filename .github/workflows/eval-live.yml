name: Paid evaluation

# A manually dispatched, budgeted live run. It never triggers on a push or a
# pull request, so a fork can never reach the model credential, and one run at
# a time keeps the spend predictable. A full batch runs as twenty parallel shards,
# one run of one Scenario each, and one aggregate job merges their documents back
# into the single batch document that a full run publishes.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "measured runs oom once to confirm cost; full runs every Scenario twice"
        type: choice
        options: [measured, full]
        default: measured
      scenarios:
        description: "Optional comma-separated Scenario override; empty uses the phase default"
        type: string
        required: false
        default: ""
      repeats:
        description: "Repeats per Scenario"
        type: number
        required: false
        default: 1
      max_tokens:
        description: "Hard token budget for the whole batch"
        type: number
        required: false
        # One live investigation may use its full 100,000-input-token budget and
        # the harness fails a batch whose spend exceeds its own budget, so the
        # measured default must clear a single investigation. A full batch passes
        # this budget to each of its twenty single-run shards.
        default: 150000
      max_cost_usd:
        description: "Hard cost budget in USD for the whole batch"
        type: number
        required: false
        default: 1
      confirm_paid_run:
        description: "Type yes to spend money on a live model"
        type: string
        required: true
        default: ""
      model_provider:
        description: "Measured provider"
        type: choice
        options: [anthropic, bedrock]
        default: anthropic

concurrency:
  group: paid-evaluation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    name: Live evaluation (${{ matrix.shard.id }})
    runs-on: ubuntu-24.04
    # One shard is one run of one Scenario, so the slowest shard is the
    # memory-leak run: ContainerMemoryGrowth only fires for a pod older than 15
    # minutes, and the harness must wait out whatever age the pod still lacks.
    timeout-minutes: 50
    strategy:
      # One shard's failure must not cancel the others, so the aggregate job can
      # report every shard's outcome instead of only the first failure.
      fail-fast: false
      matrix:
        # A full batch without an override runs every Scenario twice as twenty
        # single-run shards on twenty runners. Any other dispatch is a single
        # shard that runs every repeat of the Scenarios it names.
        shard: ${{ fromJSON((inputs.phase == 'full' && inputs.scenarios == '') && '[{"id":"01-oom-r1","scenarios":"oom","repeat":"1"},{"id":"02-oom-r2","scenarios":"oom","repeat":"2"},{"id":"03-bad-config-r1","scenarios":"bad-config","repeat":"1"},{"id":"04-bad-config-r2","scenarios":"bad-config","repeat":"2"},{"id":"05-bad-image-tag-r1","scenarios":"bad-image-tag","repeat":"1"},{"id":"06-bad-image-tag-r2","scenarios":"bad-image-tag","repeat":"2"},{"id":"07-unschedulable-r1","scenarios":"unschedulable","repeat":"1"},{"id":"08-unschedulable-r2","scenarios":"unschedulable","repeat":"2"},{"id":"09-cart-flag-r1","scenarios":"cart-flag","repeat":"1"},{"id":"10-cart-flag-r2","scenarios":"cart-flag","repeat":"2"},{"id":"11-payment-flag-r1","scenarios":"payment-flag","repeat":"1"},{"id":"12-payment-flag-r2","scenarios":"payment-flag","repeat":"2"},{"id":"13-product-catalog-flag-r1","scenarios":"product-catalog-flag","repeat":"1"},{"id":"14-product-catalog-flag-r2","scenarios":"product-catalog-flag","repeat":"2"},{"id":"15-email-memory-leak-r1","scenarios":"email-memory-leak","repeat":"1"},{"id":"16-email-memory-leak-r2","scenarios":"email-memory-leak","repeat":"2"},{"id":"17-cpu-r1","scenarios":"cpu","repeat":"1"},{"id":"18-cpu-r2","scenarios":"cpu","repeat":"2"},{"id":"19-injection-r1","scenarios":"injection","repeat":"1"},{"id":"20-injection-r2","scenarios":"injection","repeat":"2"}]' || format('[{{"id":"single","scenarios":"{0}"}}]', inputs.scenarios != '' && inputs.scenarios || (inputs.phase == 'full' && 'all' || 'oom'))) }}
    steps:
      - name: Check the paid-run confirmation and budget
        env:
          CONFIRM: ${{ inputs.confirm_paid_run }}
          MAX_COST: ${{ inputs.max_cost_usd }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "yes" ] || { echo "Refusing to run: confirm_paid_run must be exactly yes." >&2; exit 1; }
          python3 - <<'PY'
          import os, sys
          cost = float(os.environ["MAX_COST"])
          if cost <= 0 or cost > 4.5:
              sys.exit("The batch cost budget must be positive and at most 4.5 USD inside the 5 USD mission cap.")
          PY

      - name: Announce the batch in the job summary
        env:
          SHARD: ${{ matrix.shard.id }}
          SCENARIOS: ${{ matrix.shard.scenarios }}
          REPEATS: ${{ inputs.phase == 'full' && 2 || inputs.repeats }}
          REPEAT: ${{ matrix.shard.repeat }}
          MAX_TOKENS: ${{ inputs.max_tokens }}
          MAX_COST: ${{ inputs.max_cost_usd }}
        run: |
          set -euo pipefail
          {
            echo "## Pagerless paid evaluation"
            echo
            echo "- Phase: ${{ inputs.phase }} on ${{ inputs.model_provider }}"
            echo "- Shard: \`${SHARD}\`"
            echo "- Scenarios: \`${SCENARIOS}\`, repeat ${REPEAT:-all} of ${REPEATS}"
            echo "- Budget: ${MAX_TOKENS} tokens, USD ${MAX_COST}"
            echo
            echo "The harness appends one line per completed run below as it finishes."
            echo
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.14.10"

      - name: Install pinned Kubernetes tools
        run: |
          set -euo pipefail
          . hack/versions.env
          curl --fail --silent --show-error --location "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" --output kind
          chmod +x kind
          sudo install kind /usr/local/bin/kind
          curl --fail --silent --show-error --location "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" --output kubectl
          chmod +x kubectl
          sudo install kubectl /usr/local/bin/kubectl
          curl --fail --silent --show-error --location "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output helm.tar.gz
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm

      - name: Run the paid evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGERLESS_E2E: "1"
          PAGERLESS_E2E_EVAL: "1"
          PAGERLESS_E2E_MODEL_PROVIDER: ${{ inputs.model_provider }}
          PAGERLESS_E2E_SCENARIOS: ${{ matrix.shard.scenarios }}
          PAGERLESS_E2E_REPEATS: ${{ inputs.phase == 'full' && 2 || inputs.repeats }}
          PAGERLESS_E2E_REPEAT_NUMBER: ${{ matrix.shard.repeat }}
          PAGERLESS_E2E_MAX_TOKENS: ${{ inputs.max_tokens }}
          PAGERLESS_E2E_MAX_COST_USD: ${{ inputs.max_cost_usd }}
          PAGERLESS_E2E_CAPTURE: ${{ inputs.phase == 'measured' && matrix.shard.id == 'single' && '1' || '0' }}
          PAGERLESS_E2E_LIVE: "1"
          PAGERLESS_E2E_REQUIRE_PASS: "1"
          PAGERLESS_E2E_DIAGNOSTICS: ${{ github.workspace }}/e2e-diagnostics
          PAGERLESS_E2E_MEMORY_PEAK: ${{ github.workspace }}/memory-samples.txt
          PLATFORM_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$PAGERLESS_E2E_CAPTURE" = "1" ] && [ "$PAGERLESS_E2E_SCENARIOS" != "oom" ]; then
            echo "Recording is supported only for the measured oom Scenario." >&2
            exit 1
          fi
          bash evals/e2e/run.sh

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results-${{ github.sha }}-${{ inputs.phase }}-${{ matrix.shard.id }}
          path: evals/results
          if-no-files-found: ignore

      - name: Upload Replay recordings
        if: always() && inputs.phase == 'measured' && matrix.shard.id == 'single'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-recordings-${{ github.sha }}
          path: |
            evals/replay/oom.json
            evals/replay/oom.provenance.json
            evals/replay/narrative.json
          if-no-files-found: ignore

      - name: Upload the memory samples
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-samples-${{ github.sha }}-${{ inputs.phase }}-${{ matrix.shard.id }}
          path: memory-samples.txt
          if-no-files-found: ignore

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paid-eval-diagnostics-${{ github.sha }}-${{ matrix.shard.id }}
          path: e2e-diagnostics
          if-no-files-found: ignore

  aggregate:
    name: Aggregate full evaluation
    needs: [evaluate]
    # Only a sharded full batch has documents to merge. A measured run and a
    # single-Scenario override publish their one shard's artifacts as they are.
    if: always() && inputs.phase == 'full' && inputs.scenarios == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Fail when a shard did not finish
        if: needs.evaluate.result != 'success'
        run: |
          echo "The evaluation shards did not all succeed: ${{ needs.evaluate.result }}." >&2
          echo "Inspect each shard's log and its paid-eval-diagnostics artifact before merging." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.14.10"

      - name: Download the shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/shards
          # The artifact list is paginated, and each zip holds the paths its shard
          # uploaded. Both are read through the API with the workflow token, so no
          # third-party action downloads or extracts them.
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name] | @tsv' > /tmp/artifacts.tsv
          awk -F'\t' -v pattern="^(eval-results|memory-samples)-${GITHUB_SHA}-full-" \
            '$2 ~ pattern { print }' /tmp/artifacts.tsv > /tmp/shard-artifacts.tsv
          [ -s /tmp/shard-artifacts.tsv ] ||
            { echo "The run published no full-batch shard artifacts." >&2; exit 1; }
          while IFS=$'\t' read -r id name; do
            # GitHub's artifact storage answers a transient HTTP 503 under load,
            # so each download is retried with backoff and checked for a ZIP
            # header before the next artifact starts.
            for attempt in 1 2 3 4 5; do
              if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "/tmp/shards/${name}.zip" &&
                [ "$(head -c 4 "/tmp/shards/${name}.zip" | od -An -tx1 | tr -d ' \n')" = "504b0304" ]; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "Downloading artifact ${name} (${id}) failed after ${attempt} attempts." >&2
                exit 1
              fi
              echo "Retrying artifact ${name} (${id}) after attempt ${attempt}." >&2
              sleep $((attempt * 3))
            done
          done < /tmp/shard-artifacts.tsv
          uv run --no-project --python 3.14.10 python - <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          archives = sorted(Path("/tmp/shards").glob("*.zip"))
          if not archives:
              sys.exit("No shard archive was downloaded.")
          for archive in archives:
              target = archive.with_suffix("")
              target.mkdir()
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(target)
              print(f"Extracted {archive.name} into {target}")
          PY

      - name: Merge the shard results
        run: |
          set -euo pipefail
          cd evals/harness
          # The merge refuses a batch that misses a shard, covers the wrong
          # Scenarios or repeats, comes from a dirty or foreign checkout, or
          # records a failed run, so the published document is the whole batch.
          uv run --no-project --python 3.14.10 python -m pagerless_eval.results merge \
            --shards /tmp/shards \
            --out-dir "$GITHUB_WORKSPACE/evals/results" \
            --commit "$GITHUB_SHA" \
            --scenarios all \
            --summary "$GITHUB_STEP_SUMMARY"
          : >"$GITHUB_WORKSPACE/memory-samples.txt"
          find /tmp/shards -name memory-samples.txt -print0 |
            sort -z | xargs -0 -r cat >>"$GITHUB_WORKSPACE/memory-samples.txt"
          [ -s "$GITHUB_WORKSPACE/memory-samples.txt" ] ||
            { echo "The shards published no memory samples." >&2; exit 1; }

      - name: Upload the merged evaluation results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results-${{ github.sha }}-full
          path: evals/results
          if-no-files-found: error

      - name: Upload the merged memory samples
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-samples-${{ github.sha }}-full
          path: memory-samples.txt
          if-no-files-found: error
