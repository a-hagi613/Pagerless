name: Infrastructure

# The free half of the Phase 3 test plan: formatting, validation and linting of
# every Terraform configuration. It needs no AWS credentials, so it runs on
# every pull request that touches infra/.
#
# The read-only plan against the account, which does need credentials, is added
# by the keyless CI ticket.

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform format, validation and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: Validate the state bootstrap
        working-directory: infra/bootstrap
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate the stack
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - name: Lint
        working-directory: infra
        run: |
          set -euo pipefail
          tflint --init
          tflint --recursive
