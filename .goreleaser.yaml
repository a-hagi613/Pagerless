# GoReleaser builds the installable CLI artifacts for one release: four
# archives (linux/darwin on amd64/arm64), the SHA-256 checksum file, and one
# SBOM per archive. `make release-snapshot` runs this file with --snapshot, so
# the configuration is exercised on every pull request without a tag, a
# registry credential, or a GitHub token.
#
# The fresh release tag is pagerless-v<version>, not v<version>: the legacy
# v1.0.0 and v2.0.0 tags and releases are immutable. GoReleaser OSS parses the
# current tag as semver and rejects the prefix, so the release workflow
# validates the tag itself and passes the exact version through
# SNAPSHOT_VERSION. GitHub Release creation and asset upload happen from the
# verified dist/ directory in .github/workflows/release.yml, which is also
# where the chart and the images are published.
version: 2

project_name: pagerless

builds:
  - id: kubectl-page
    main: ./cmd/kubectl-page
    binary: kubectl-page
    env:
      - CGO_ENABLED=0
    # -trimpath removes the checkout path and -buildvcs=false removes the VCS
    # stamp, so the archive depends on the source and the toolchain rather than
    # on where and how the tree was cloned.
    flags:
      - -trimpath
      - -buildvcs=false
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/a-hagi613/pagerless/internal/cli.Version={{ .Version }}
      - -X github.com/a-hagi613/pagerless/internal/cli.Commit={{ .Commit }}
      - -X github.com/a-hagi613/pagerless/internal/cli.BuildDate={{ .CommitDate }}
      - -X github.com/a-hagi613/pagerless/internal/cli.ExpectedChartVersion={{ .Version }}

archives:
  - id: kubectl-page
    ids:
      - kubectl-page
    formats:
      - tar.gz
    name_template: "kubectl-page_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive
    documents:
      - "${artifact}.sbom.json"

# The snapshot version is the release version when the release workflow sets
# SNAPSHOT_VERSION, and a never-published placeholder during pull-request CI.
snapshot:
  version_template: '{{ if .Env.SNAPSHOT_VERSION }}{{ .Env.SNAPSHOT_VERSION }}{{ else }}0.0.0-snapshot{{ end }}'

# Publication is deliberately owned by the release workflow so that a
# prefixed immutable tag can never be mistaken for a legacy v tag, and so the
# GitHub Release is created from the artifacts that the verify job downloaded
# and installed. Running `goreleaser release` on its own must not publish.
release:
  disable: true
