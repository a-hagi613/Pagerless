[project]
name = "pagerless-agent"
version = "0.1.0"
description = "The Pagerless investigation agent."
requires-python = ">=3.14"
dependencies = [
    "anthropic[bedrock]==2.9.0",
    "boto3==1.44.4",
    "httpx==0.28.1",
    "httpx2==2.16.2",
    "langgraph==1.2.22",
    "mcp==2.3.0",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["uv_build==0.13.8"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
    "types-pyyaml==6.0.12.20261113",
]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "SIM", "UP", "W"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]

[tool.ruff.lint.per-file-ignores]
"src/pagerless_agent/prompts.py" = ["E501"]
