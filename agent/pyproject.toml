[project]
name = "pagerless-agent"
version = "1.0.0"
description = "The private Pagerless investigation agent service."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "langgraph==1.2.22",
    "openai==3.55.1",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build==0.13.8"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "SIM", "UP", "W"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]
