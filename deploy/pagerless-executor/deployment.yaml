apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagerless-executor
  namespace: pagerless
  labels:
    app.kubernetes.io/name: pagerless-executor
spec:
  # Executions are serialized inside one process (ADR-0005), so the Executor
  # runs one replica and replaces it only after the old one has stopped.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pagerless-executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pagerless-executor
    spec:
      serviceAccountName: pagerless-executor
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: executor
          image: ghcr.io/a-hagi613/pagerless-executor:0.1.0
          args:
            - --github-token-file=/var/run/pagerless/github/token
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The Sandbox is the user's fork, so its URL is not fixed in the manifest.
            - name: SANDBOX_URL
              valueFrom:
                configMapKeyRef:
                  name: pagerless-sandbox
                  key: url
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: github-write
              mountPath: /var/run/pagerless/github
              readOnly: true
            # Each execution clones the Sandbox into a temporary directory.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: github-write
          secret:
            secretName: github-write
            items:
              - key: token
                path: token
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
