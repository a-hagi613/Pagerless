apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pagerless-executor
  namespace: pagerless
rules:
  # Confirms for itself that a Triage is Approved and that a TriageApproval exists for the exact Proposal hash
  # (ADR-0014). It only reads: Triage status is written by pagerless-server alone (ADR-0001), and a TriageApproval
  # is created only by a human.
  - apiGroups: [pagerless.dev]
    resources: [triages, triageapprovals]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pagerless-executor
  namespace: pagerless
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pagerless-executor
subjects:
  - kind: ServiceAccount
    name: pagerless-executor
    namespace: pagerless
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pagerless-executor
rules:
  # Verifies the projected token that pagerless-server presents.
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pagerless-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pagerless-executor
subjects:
  - kind: ServiceAccount
    name: pagerless-executor
    namespace: pagerless
---
# RestartWorkload executes live (ADR-0002): the Executor deletes the Workload's
# pods one at a time and reads the Workload and its pods to wait for each
# replacement. The Role limits that write to the Sandbox namespace, where the
# demo Workloads live.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pagerless-executor-restart
  namespace: sandbox
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pagerless-executor-restart
  namespace: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pagerless-executor-restart
subjects:
  - kind: ServiceAccount
    name: pagerless-executor
    namespace: pagerless
