# Values for the kube-prometheus-stack chart 93.3.0, read by the Argo CD Application
# in deploy/apps/templates. Requests are modest so that the whole local stack fits
# the 8 GiB memory preflight in hack/preflight.sh.

# kind binds these control-plane components to the loopback address of the node,
# so the chart cannot scrape them.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 24h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    # Select every rule and monitor, not only those labelled with the Helm release.
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Only opted-in alerts reach pagerless-server (spec #1, Alert Trigger).
        - receiver: pagerless-server
          matchers:
            - 'pagerless_triage="true"'
    receivers:
      - name: "null"
      - name: pagerless-server
        webhook_configs:
          - url: http://pagerless-server.pagerless.svc:8080/v1/alerts/alertmanager
            send_resolved: true
            # Bearer token authentication is added here, through http_config.authorization,
            # by the receiver authentication follow-up.
            http_config: {}

grafana:
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
