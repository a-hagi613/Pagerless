apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  # The Grafana sidecar discovers any ConfigMap with this label, in any namespace.
  labels:
    grafana_dashboard: "1"
  # A stable name keeps the provisioned dashboard easy to find and lets Argo CD update it in place.
  disableNameSuffixHash: true
configMapGenerator:
  - name: pagerless-dashboard
    files:
      - pagerless.json
  # The dashboards that the Pagerless Triage detail view embeds for a Workload's metrics and logs. Their UIDs are
  # the defaults of --grafana-workload-dashboard-uid and --grafana-logs-dashboard-uid.
  - name: pagerless-workload-dashboards
    files:
      - workload-metrics.json
      - workload-logs.json
