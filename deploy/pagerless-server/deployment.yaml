apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagerless-server
  namespace: pagerless
  labels:
    app.kubernetes.io/name: pagerless-server
spec:
  # pagerless-server is the single writer of Triage status (ADR-0001, ADR-0005),
  # so it runs one replica and replaces it only after the old one has stopped.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pagerless-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pagerless-server
    spec:
      serviceAccountName: pagerless-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/a-hagi613/pagerless-server:0.1.0
          args:
            - --agent-image=ghcr.io/a-hagi613/pagerless-agent:0.1.0
            - --report-url=http://pagerless-server.pagerless.svc:8080
            - --alert-namespaces=sandbox
            - --executor-url=http://pagerless-executor.pagerless.svc:8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: report
              containerPort: 8080
            - name: webhook
              containerPort: 9443
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: webhook-certs
              mountPath: /var/run/pagerless/webhook-certs
            - name: executor-token
              mountPath: /var/run/secrets/pagerless/executor
              readOnly: true
      volumes:
        # The token that authenticates the server to pagerless-executor (ADR-0014). Its audience is the Executor's,
        # so no other service accepts it, and the kubelet rotates it in place.
        - name: executor-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: pagerless-executor
                  expirationSeconds: 3600
                  path: token
        - name: webhook-certs
          emptyDir:
            medium: Memory
