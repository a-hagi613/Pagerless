apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagerless-server
  namespace: pagerless
  labels:
    app.kubernetes.io/name: pagerless-server
spec:
  # pagerless-server is the single writer of Triage status (ADR-0001, ADR-0005),
  # so it runs one replica and replaces it only after the old one has stopped.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pagerless-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pagerless-server
    spec:
      serviceAccountName: pagerless-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Give the non-root server write access to the emptyDir volumes.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/a-hagi613/pagerless-server:1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --agent-image=ghcr.io/a-hagi613/pagerless-agent:1.0.0
            - --report-url=http://pagerless-server.pagerless.svc:8080
            - --metrics-bind-address=:9090
            - --dashboard-bind-address=:8082
            # The browser reaches Grafana through its own port-forward, so the panel URLs use the reader's
            # localhost. The dashboard UIDs default to the dashboards in deploy/observability/dashboards.
            - --grafana-url=http://localhost:3000
            # Sign-in runs against Keycloak. The browser reaches the dashboard on localhost:8080 through a
            # port-forward, which is also the redirect URI the realm allows, and it is plain HTTP, so the
            # session and flow cookies cannot be marked Secure there. Set the flag to true behind TLS.
            - --dashboard-base-url=http://localhost:8080
            - --dashboard-cookie-secure=false
            - --oidc-issuer=http://keycloak.keycloak.svc.cluster.local:8080/realms/pagerless
            - --oidc-client-id=pagerless-dashboard
            - --oidc-client-secret-file=/var/run/pagerless/keycloak/client-secret
            - --keycloak-base-url=http://keycloak.keycloak.svc.cluster.local:8080
            - --keycloak-admin-client-id=pagerless-server
            - --keycloak-admin-client-secret-file=/var/run/pagerless/keycloak/server-client-secret
            - --approvers-group=pagerless-approvers
            - --workload-namespaces=sandbox
            - --history-path=/var/lib/pagerless/history.db
            - --alert-namespaces=sandbox
            - --executor-url=http://pagerless-executor.pagerless.svc:8080
            - --argocd-url=http://argocd-server.argocd.svc
            - --alertmanager-url=http://kube-prometheus-stack-alertmanager.monitoring.svc:9093
            - --alertmanager-token-file=/var/run/pagerless/alertmanager/token
            - --sandbox-read-token-file=/var/run/pagerless/github-read/token
          envFrom:
            - configMapRef:
                name: pagerless-agent-config
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: report
              containerPort: 8080
            - name: webhook
              containerPort: 9443
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 9090
            - name: dashboard
              containerPort: 8082
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: alertmanager-token
              mountPath: /var/run/pagerless/alertmanager
              readOnly: true
            - name: webhook-certs
              mountPath: /var/run/pagerless/webhook-certs
            - name: executor-token
              mountPath: /var/run/secrets/pagerless/executor
              readOnly: true
            - name: argocd-token
              mountPath: /var/run/secrets/pagerless/argocd
              readOnly: true
            - name: temporary
              mountPath: /tmp
            - name: github-read
              mountPath: /var/run/pagerless/github-read
              readOnly: true
            # The Keycloak identity: the dashboard client's secret completes the sign-in, and the server
            # client's secret reads approver group membership (ADR-0020). Neither is in this repository.
            - name: keycloak
              mountPath: /var/run/pagerless/keycloak
              readOnly: true
            # The append-only history survives a server restart, so a Triage's record is not lost with its pod.
            - name: history
              mountPath: /var/lib/pagerless
      volumes:
        - name: alertmanager-token
          secret:
            secretName: pagerless-alertmanager
        - name: github-read
          secret:
            secretName: github-read
        - name: keycloak
          secret:
            secretName: pagerless-keycloak-dashboard
        - name: argocd-token
          secret:
            secretName: argocd-read
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        # The token that authenticates the server to pagerless-executor (ADR-0014). Its audience is the Executor's,
        # so no other service accepts it, and the kubelet rotates it in place.
        - name: executor-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: pagerless-executor
                  expirationSeconds: 3600
                  path: token
        - name: webhook-certs
          emptyDir:
            medium: Memory
        - name: history
          persistentVolumeClaim:
            claimName: pagerless-history
