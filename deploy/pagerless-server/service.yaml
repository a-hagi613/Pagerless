apiVersion: v1
kind: Service
metadata:
  name: pagerless-server
  namespace: pagerless
  labels:
    app.kubernetes.io/name: pagerless-server
spec:
  selector:
    app.kubernetes.io/name: pagerless-server
  ports:
    - name: report
      port: 8080
      targetPort: report
    - name: webhook
      port: 443
      targetPort: webhook
    - name: metrics
      port: 9090
      targetPort: metrics
