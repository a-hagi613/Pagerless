apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pagerless-server
  namespace: pagerless
rules:
  # Creates a Triage for each opted-in alert (internal/alerts).
  - apiGroups: [pagerless.dev]
    resources: [triages]
    verbs: [create, get, list, watch]
  - apiGroups: [pagerless.dev]
    resources: [triages/status]
    verbs: [get, update, patch]
  # Reads each TriageApproval and applies its decision to the Triage; it never creates or changes one.
  - apiGroups: [pagerless.dev]
    resources: [triageapprovals]
    verbs: [get, list, watch]
  # Needed to set blockOwnerDeletion on the agent Job's owner reference.
  - apiGroups: [pagerless.dev]
    resources: [triages/finalizers]
    verbs: [update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch]
  # Reads the pod that a presented agent token is bound to.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pagerless-server
  namespace: pagerless
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pagerless-server
subjects:
  - kind: ServiceAccount
    name: pagerless-server
    namespace: pagerless
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pagerless-server
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  # Validation reads the target Workload and dry-runs the patched Workload against it. Kubernetes RBAC cannot
  # limit a verb to dry runs, so the server's code sends update only with dryRun=All and only to Workloads in
  # the namespaces allowed for PatchResources. The Executor, not the server, makes live changes (ADR-0008).
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, update]
  # Verification lists a Workload's pods to see whether any container restarted or was OOMKilled during the
  # observation window (ADR-0006). It only reads them.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  # Publishes the generated certificate authority in its own webhook configuration.
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    resourceNames: [pagerless-server]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pagerless-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pagerless-server
subjects:
  - kind: ServiceAccount
    name: pagerless-server
    namespace: pagerless
---
# Bind this Role to the people who may approve or reject a Proposal. Creating a
# TriageApproval is the only act that moves a Proposed Triage forward, so
# Kubernetes RBAC decides who may approve (ADR-0004). It grants no write access
# to Triages or their status.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pagerless-approver
  namespace: pagerless
rules:
  - apiGroups: [pagerless.dev]
    resources: [triages, triageapprovals]
    verbs: [get, list, watch]
  - apiGroups: [pagerless.dev]
    resources: [triageapprovals]
    verbs: [create]
