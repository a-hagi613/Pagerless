# The caBundle fields are filled in by pagerless-server at every start, from the
# certificate authority it generates (see internal/webhooktls). A GitOps tool
# must ignore differences in /webhooks/*/clientConfig/caBundle.
#
# A TriageApproval passes through the mutating webhook first, which stamps the
# requester's identity into spec.approver. A request from pagerless-server may
# instead assert the dashboard user it verified through Keycloak (ADR-0020). The
# validating webhook then binds the decision to the current Proposal and checks
# that an asserted approver is a member of the Keycloak approvers group.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: pagerless-server
webhooks:
  - name: stamp.triageapprovals.pagerless.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    reinvocationPolicy: Never
    timeoutSeconds: 10
    clientConfig:
      service:
        name: pagerless-server
        namespace: pagerless
        path: /mutate-triageapproval
        port: 443
    rules:
      - apiGroups: [pagerless.dev]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [triageapprovals]
        scope: Namespaced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: pagerless-server
webhooks:
  - name: create.triages.pagerless.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: pagerless-server
        namespace: pagerless
        path: /validate-triage-create
        port: 443
    rules:
      - apiGroups: [pagerless.dev]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [triages]
        scope: Namespaced
  - name: status.triages.pagerless.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: pagerless-server
        namespace: pagerless
        path: /validate-triage-status
        port: 443
    rules:
      - apiGroups: [pagerless.dev]
        apiVersions: [v1alpha1]
        operations: [UPDATE]
        resources: [triages/status]
        scope: Namespaced
  - name: create.triageapprovals.pagerless.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: pagerless-server
        namespace: pagerless
        path: /validate-triageapproval
        port: 443
    rules:
      - apiGroups: [pagerless.dev]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [triageapprovals]
        scope: Namespaced
