# pagerless-server writes Triage status and creates agent Jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pagerless-server
  namespace: pagerless
---
# The agent runs as this service account. It is bound to no Role, so it holds
# no write permissions; its projected token only proves its identity to
# pagerless-server (ADR-0001).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pagerless-agent
  namespace: pagerless
automountServiceAccountToken: false
