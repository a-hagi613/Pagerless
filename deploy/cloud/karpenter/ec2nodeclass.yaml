# Karpenter's view of the cluster's network and identity.
#
# Applied by `make cloud-up` after the cluster and the Karpenter chart are ready.
# The role name is set in infra/karpenter.tf; the tag values are set in
# infra/discovery.tf and by the EKS module's node_security_group_tags.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: pagerless-karpenter-node
  amiSelectorTerms:
    # The Amazon Linux 2023 EKS-optimized release for the cluster's Kubernetes
    # version. Karpenter resolves the alias; pinning a dated alias would silently
    # stop receiving security updates.
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: pagerless
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: pagerless
  metadataOptions:
    # The nodes need no instance metadata: the Pod Identity agent issues
    # credentials, so IMDSv2-only costs nothing.
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
