# Values for the Pagerless identity provider. The realm itself is provisioned by
# hack/provision-keycloak.py after Keycloak is ready; no credential is stored in
# this repository. The bootstrap Secret keycloak-credentials is created by
# hack/up.sh and holds the master-realm admin password and the database password.

keycloak:
  image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
  # The realm issuer is derived from this URL. It must equal the audience of the
  # agent's projected service account token and the issuer agentgateway requires.
  hostname: http://keycloak.keycloak.svc.cluster.local:8080
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi

database:
  image: docker.io/library/postgres:17.12-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
