# Keycloak needs a database: the development in-memory store loses the realm on
# every restart. The single replica and the retained claim fit the local stack.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-database
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak-database
spec:
  selector:
    app.kubernetes.io/name: keycloak-database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-database
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak-database
spec:
  serviceName: keycloak-database
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.database.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              value: keycloak
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: database-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "--username=keycloak", "--dbname=keycloak"]
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["pg_isready", "--username=keycloak", "--dbname=keycloak"]
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources: {{- toYaml .Values.database.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.database.storage }}
