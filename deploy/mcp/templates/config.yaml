apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-kubernetes
data:
  config.toml: |
    port = "8080"
    bind_address = "0.0.0.0"
    read_only = true
    list_output = "yaml"
    toolsets = ["core"]
    enabled_tools = ["resources_get", "resources_list", "pods_get", "pods_list_in_namespace", "pods_log", "events_list"]
    max_result_bytes = 1048576
    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "Secret"
