{{- range $namespace := .Values.allowedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pagerless-mcp-read
  namespace: {{ $namespace | quote }}
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  # The agent needs to see an active Chaos Mesh experiment to name the external
  # cause of a failure (Scenario 9). The group and the kind are both explicit,
  # so the role cannot read any other custom resource.
  - apiGroups: [chaos-mesh.org]
    resources: [stresschaos]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pagerless-mcp-read
  namespace: {{ $namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pagerless-mcp-read
subjects:
  - kind: ServiceAccount
    name: mcp-kubernetes
    namespace: {{ $.Release.Namespace | quote }}
{{- end }}
