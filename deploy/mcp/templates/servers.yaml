{{- range $name, $server := .Values.servers }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-{{ $name }}
automountServiceAccountToken: {{ $server.kubernetesAccess | default false }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-{{ $name }}
spec:
  selector:
    app.kubernetes.io/name: mcp-{{ $name }}
  ports:
    - name: mcp
      port: {{ $server.port }}
      targetPort: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-{{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-{{ $name }}
    spec:
      serviceAccountName: mcp-{{ $name }}
      automountServiceAccountToken: {{ $server.kubernetesAccess | default false }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: {{ $server.image | quote }}
          imagePullPolicy: IfNotPresent
          args: {{ $server.args | toJson }}
          {{- if or $server.env (and (eq $name "github") $.Values.githubHost) }}
          env:
            {{- with $server.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if and (eq $name "github") $.Values.githubHost }}
            - name: GITHUB_HOST
              value: {{ $.Values.githubHost | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: mcp
              containerPort: {{ $server.port }}
          readinessProbe:
            tcpSocket:
              port: mcp
          livenessProbe:
            tcpSocket:
              port: mcp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          {{- if eq $name "kubernetes" }}
          volumeMounts:
            - name: config
              mountPath: /etc/mcp
              readOnly: true
          {{- end }}
      {{- if eq $name "kubernetes" }}
      volumes:
        - name: config
          configMap:
            name: mcp-kubernetes
      {{- end }}
{{- end }}
