# Image manifests and release tags verified on 2026-11-17; see README.md.
allowedNamespaces:
  - sandbox
# Empty selects GitHub.com. HTTP overrides are accepted upstream only for loopback hosts.
githubHost: ""
servers:
  kubernetes:
    image: quay.io/containers/kubernetes_mcp_server:v0.1.3@sha256:6347155616c49c78512114500688b50d275ddde7597b6a38cefe6f40a8c42c16
    port: 8080
    args: [--config, /etc/mcp/config.toml]
    kubernetesAccess: true
  grafana:
    image: docker.io/grafana/mcp-grafana:2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
    port: 8000
    args:
      - -t
      - streamable-http
      - --address
      - :8000
      - --allowed-hosts=mcp-grafana.pagerless.svc:8000,mcp-grafana.pagerless.svc.cluster.local:8000
      - --disable-write
      - --enable-query
      - --enabled-tools=datasource,prometheus,loki,tempo
    env:
      - name: GRAFANA_URL
        value: http://kube-prometheus-stack-grafana.monitoring.svc
      - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
        valueFrom:
          secretKeyRef: {name: mcp-backend-tokens, key: grafana}
      - name: MCP_GRAFANA_SERVER_TOKEN
        valueFrom:
          secretKeyRef: {name: mcp-client-tokens, key: grafana}
  argocd:
    image: ghcr.io/argoproj-labs/mcp-for-argocd:0.9.0@sha256:dffc6c719d8635be2d5f2c8ad1c0178540325da4b40da0b373307e12b4c48f86
    port: 3000
    args: [http, --stateless, --bind-address, 0.0.0.0]
    env:
      - name: ARGOCD_BASE_URL
        value: http://argocd-server.argocd.svc
      - name: ARGOCD_API_TOKEN
        valueFrom:
          secretKeyRef: {name: argocd-read, key: token}
      - name: MCP_AUTH_TOKEN
        valueFrom:
          secretKeyRef: {name: mcp-client-tokens, key: argocd}
      - name: MCP_READ_ONLY
        value: "true"
  github:
    image: ghcr.io/github/github-mcp-server:v2.2.0@sha256:040c4e99810076035eb1d9beb4b4a96fcf589c43cefed6ff51a46a553eb4e174
    port: 8082
    args: [http, --port, "8082", --read-only, --toolsets=, --tools=list_commits,get_commit,get_file_contents]
