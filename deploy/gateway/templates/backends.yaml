{{- range $name, $server := .Values.mcp.servers }}
---
# An MCP-aware backend addresses the Phase 1 Service by its cluster DNS name.
# The gateway forwards to the server's own path, which differs for GitHub.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  mcp:
    targets:
      - name: {{ $name }}
        static:
          host: {{ $server.service }}.{{ $.Values.mcp.namespace }}.svc.cluster.local
          port: {{ $server.port }}
          path: {{ $server.path }}
          protocol: StreamableHTTP
{{- end }}
