# Values for the Pagerless MCP gateway. The agentgateway control plane and its
# CRDs are installed separately by the agentgateway Argo CD Applications; this
# chart owns the Gateway, the MCP backends, the routes, and the policies.

# The proxy image is pinned by digest. The controller passes this to the data
# plane it creates for the Gateway; the controller image itself is pinned by the
# agentgateway chart version (1.7.0).
proxy:
  image:
    registry: cr.agentgateway.dev
    repository: agentgateway
    digest: sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b

keycloak:
  # The issuer is the `iss` claim that agentgateway requires and the audience of
  # the agent's projected service account token.
  issuer: http://keycloak.keycloak.svc.cluster.local:8080/realms/pagerless
  jwksPath: /realms/pagerless/protocol/openid-connect/certs
  service: keycloak
  namespace: keycloak
  port: 8080
  # Keycloak issues service-account access tokens with the `account` audience.
  audiences:
    - account

mcp:
  # Namespace of the MCP servers that remain from Phase 1.
  namespace: pagerless
  # Credentials for the servers that still authenticate their caller. The
  # gateway reads a key per server from this Secret in its own namespace, and
  # sends it as the backend's bearer token. The values are provisioned from the
  # Phase 1 caller tokens; none is stored in this repository.
  backendTokens:
    secret: mcp-client-tokens
  servers:
    kubernetes:
      service: mcp-kubernetes
      port: 8080
      path: /mcp
      # Resources whose kind is not in deniedResourceKinds.
      resourceTools:
        - resources_get
        - resources_list
      # The Kubernetes MCP server authorizes with its own read-only service
      # account, so the gateway sends it no bearer token.
      tools:
        - pods_get
        - pods_list_in_namespace
        - pods_log
        - events_list
      deniedResourceKinds:
        - secret
    grafana:
      service: mcp-grafana
      port: 8000
      path: /mcp
      tokenKey: grafana
      tools:
        - list_datasources
        - get_datasource_by_uid
        - query_prometheus
        - query_loki_logs
        - query_loki_stats
        - query_tempo
        - get_tempo_trace
    argocd:
      service: mcp-argocd
      port: 3000
      path: /mcp
      tokenKey: argocd
      tools:
        - get_application
        - get_application_resource
        - get_application_resource_tree
        - get_application_workload_logs
    github:
      service: mcp-github
      port: 8082
      path: /readonly
      tokenKey: github
      tools:
        - list_commits
        - get_commit
        - get_file_contents
        - get_pull_request
