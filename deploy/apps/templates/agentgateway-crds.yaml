# The agentgateway CRDs, from the pinned OCI chart (Helm reports
# sha256:946b739c0fcda4d47a72d1589d184b6fd507772e733cbedf02789bafd0468064).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://cr.agentgateway.dev/charts
    chart: agentgateway-crds
    targetRevision: v1.7.0
    helm:
      releaseName: agentgateway-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
