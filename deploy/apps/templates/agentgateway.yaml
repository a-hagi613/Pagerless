# The agentgateway control plane, from the pinned OCI chart v1.7.0
# (sha256:40340d639e35206317c934e9af3e29575cf7c5377b2940679732baac6e108c15).
# The chart pin also pins the controller image tag v1.7.0.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: cr.agentgateway.dev/charts
      chart: agentgateway
      targetRevision: v1.7.0
      helm:
        releaseName: agentgateway
        valueFiles:
          - $values/deploy/agentgateway/values.yaml
    - repoURL: {{ required "platform.repoURL is required" .Values.platform.repoURL | quote }}
      targetRevision: {{ required "platform.targetRevision is required" .Values.platform.targetRevision | quote }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: agentgateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
