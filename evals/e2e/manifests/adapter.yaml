apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-adapter
  namespace: pagerless-e2e
  labels:
    app.kubernetes.io/name: sandbox-adapter
    app.kubernetes.io/part-of: pagerless-e2e
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-adapter
        app.kubernetes.io/part-of: pagerless-e2e
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          image: ghcr.io/a-hagi613/pagerless-e2e-adapter:0.1.0-e2e
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --repository=pagerless-test/sandbox
            - --repository-root=/var/lib/pagerless
            - --source=https://github.com/a-hagi613/pagerless-sandbox.git
            - --revision=9eff68bdf72bcf9e99d6d713a152995d851aa841
            - --read-token-file=/var/run/pagerless/read-token
            - --write-token-file=/var/run/pagerless/write-token
            - --tls-cert=/var/run/pagerless/tls/tls.crt
            - --tls-key=/var/run/pagerless/tls/tls.key
          ports:
            - name: control
              containerPort: 8080
            - name: git-https
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: git-https
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: git-https
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: repository
              mountPath: /var/lib/pagerless
            - name: credentials
              mountPath: /var/run/pagerless
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: repository
          emptyDir: {}
        - name: credentials
          projected:
            sources:
              - secret:
                  name: sandbox-adapter-token
                  items:
                    - key: read-token
                      path: read-token
                    - key: write-token
                      path: write-token
              - secret:
                  name: sandbox-adapter-tls
                  items:
                    - key: tls.crt
                      path: tls/tls.crt
                    - key: tls.key
                      path: tls/tls.key
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-adapter
  namespace: pagerless-e2e
  labels:
    app.kubernetes.io/name: sandbox-adapter
    app.kubernetes.io/part-of: pagerless-e2e
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-adapter
  ports:
    - name: git-https
      port: 8443
      targetPort: git-https
