apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-github
  namespace: pagerless
spec:
  template:
    spec:
      containers:
        - name: e2e-adapter-relay
          image: ghcr.io/a-hagi613/pagerless-e2e-adapter:0.1.0-e2e
          imagePullPolicy: IfNotPresent
          args:
            - relay
            - --listen=127.0.0.1:8083
            - --target=https://sandbox-adapter.pagerless-e2e.svc:8443
            - --ca-file=/var/run/pagerless/e2e-ca/ca.crt
          ports:
            - name: adapter-relay
              containerPort: 8083
          readinessProbe:
            exec:
              command: [/usr/local/bin/pagerless-e2e-adapter, healthcheck, --url=http://127.0.0.1:8083/healthz]
          livenessProbe:
            exec:
              command: [/usr/local/bin/pagerless-e2e-adapter, healthcheck, --url=http://127.0.0.1:8083/healthz]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: pagerless-e2e-ca
              mountPath: /var/run/pagerless/e2e-ca
              readOnly: true
      volumes:
        - name: pagerless-e2e-ca
          configMap:
            name: pagerless-e2e-ca
