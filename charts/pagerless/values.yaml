# Pagerless installs one investigation service, its private agent and two
# read-only MCP integrations. Every credential is a reference to an externally
# provisioned Secret; the chart never creates or edits a Secret.

# The Secret must exist before install and carry every key named below.
existingSecret: ""

secretKeys:
  operatorToken: operator-token
  internalToken: internal-token
  mcpToken: mcp-token
  githubReadToken: github-read-token
  githubWriteToken: github-write-token
  modelApiKey: model-api-key

image:
  repository: ghcr.io/a-hagi613/pagerless-server
  # A digest wins over a tag. Leaving both empty installs the chart appVersion.
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent

agentImage:
  repository: ghcr.io/a-hagi613/pagerless-agent
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent

# The SQLite transcript has one writer, so the service runs as one replica.
replicaCount: 1

# The OpenAI-compatible endpoint and a model that supports tool calls. The key
# is mounted from existingSecret.
model:
  baseUrl: ""
  name: ""

agent:
  # Empty installs the bundled agent Service.
  url: ""
  port: 8090
  maxConcurrency: 4
  budget:
    toolCalls: 16
    modelCalls: 8
    inputTokens: 120000
    seconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  extraEnv: []

# The repository that owns the cluster's source configuration.
github:
  repository: ""
  baseBranch: main
  # When set, reads and proposals are bounded to this repository directory.
  pathPrefix: ""
  apiUrl: https://api.github.com

kubernetes:
  enabled: true
  # Empty reads every namespace with the read-only ClusterRole. A list installs
  # one Role and RoleBinding per namespace and refuses cluster-wide reads.
  namespaceAllowlist: []

mcp:
  port: 8091

service:
  type: ClusterIP
  port: 8080

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
  existingClaim: ""

# Retention and turn bounds. The transcript expires a page and its events,
# evidence and proposal after this window.
retention: 168h
turnTimeout: 10m
toolTimeout: 30s
stopGrace: 10s
maxActiveTurns: 4
maxToolCalls: 16
maxResultBytes: 65536

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: true
  # Extra egress rules appended to the server, agent and integration policies.
  # Use one when the model endpoint or a Git service runs inside the cluster on
  # a port or pod the chart cannot know.
  extraEgress: []

nodeSelector: {}
tolerations: []
affinity: {}
