---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: pages.pagerless.dev
spec:
  group: pagerless.dev
  names:
    categories:
    - pagerless
    kind: Page
    listKind: PageList
    plural: pages
    shortNames:
    - pg
    singular: page
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.target.name
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.trigger.source
      name: Trigger
      type: string
    - jsonPath: .status.pullRequest.number
      name: PR
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.target.kind
      name: Kind
      priority: 1
      type: string
    - jsonPath: .spec.target.namespace
      name: Namespace
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Page is one investigation of one failing Target, from Trigger
          to verified outcome.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PageSpec describes what to investigate. It is immutable after
              creation.
            properties:
              excludedProposalHashes:
                description: |-
                  ExcludedProposalHashes are Proposal hashes that this Page must not propose
                  again. A Recurrence excludes the Proposal hash of the Page that recorded
                  NotRecovered, so that the same change cannot be proposed forever.
                items:
                  pattern: ^[0-9a-f]{64}$
                  type: string
                maxItems: 10
                type: array
                x-kubernetes-list-type: atomic
              fingerprint:
                description: |-
                  Fingerprint is the stable failure identity. It deliberately excludes
                  messages, timestamps, and repetition counts, so that one crash loop is
                  one failure rather than hundreds.
                pattern: ^[0-9a-f]{64}$
                type: string
              hint:
                description: Hint is optional guidance from the operator, passed to
                  the agent as human input.
                maxLength: 1000
                type: string
              previousPage:
                description: PreviousPage links a Recurrence to the Page that recorded
                  the previous outcome.
                maxLength: 253
                type: string
              repository:
                description: Repository is the declared Target Repository. Empty lets
                  resolution decide.
                properties:
                  branch:
                    description: Branch is the branch a Proposal targets. It defaults
                      to main.
                    maxLength: 253
                    type: string
                  path:
                    description: Path is the Target's manifest path inside the repository,
                      relative to its root.
                    maxLength: 500
                    type: string
                  url:
                    description: URL is the HTTPS Git URL, for example https://github.com/acme/gitops.
                    maxLength: 500
                    pattern: ^https://
                    type: string
                type: object
              target:
                description: Target is the failing object.
                properties:
                  apiVersion:
                    description: APIVersion is the Target's API version, such as apps/v1.
                    maxLength: 253
                    type: string
                  kind:
                    description: Kind is the Target's kind.
                    enum:
                    - Deployment
                    - StatefulSet
                    - DaemonSet
                    - Job
                    - CronJob
                    - Pod
                    - PersistentVolumeClaim
                    - Node
                    type: string
                  name:
                    description: Name is the Target's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace is the Target's namespace. It is empty
                      only for a Node.
                    maxLength: 63
                    type: string
                  uid:
                    description: |-
                      UID is the Target's UID. It distinguishes a recreated object from the
                      object it replaced.
                    pattern: ^[0-9a-fA-F-]{36}$
                    type: string
                required:
                - kind
                - name
                - namespace
                type: object
                x-kubernetes-validations:
                - message: namespace must be set for a namespaced kind and empty for
                    Node
                  rule: 'self.kind == ''Node'' ? (!has(self.namespace) || size(self.namespace)
                    == 0) : (has(self.namespace) && size(self.namespace) > 0)'
              trigger:
                description: Trigger is the observation that opened the Page.
                properties:
                  alertFingerprint:
                    description: AlertFingerprint is the upstream alert fingerprint,
                      when one exists.
                    maxLength: 128
                    type: string
                  message:
                    description: Message is the human-readable text at first observation.
                    maxLength: 1024
                    type: string
                  pod:
                    description: Pod is the pod that raised the Trigger. It is evidence,
                      not the Target.
                    maxLength: 253
                    type: string
                  reason:
                    description: Reason is the machine-readable cause, such as CrashLoopBackOff.
                    maxLength: 128
                    type: string
                  source:
                    description: Source is what opened or joined the Page.
                    enum:
                    - Event
                    - Condition
                    - Alertmanager
                    - Grafana
                    - Datadog
                    - SNS
                    - CLI
                    - Portal
                    - API
                    type: string
                required:
                - source
                type: object
            required:
            - fingerprint
            - target
            - trigger
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: PageStatus is the observed state of a Page. Only pagerless-server
              writes it (ADR-0001).
            properties:
              agentJobName:
                description: AgentJobName is the name of the agent Job.
                maxLength: 253
                type: string
              alerts:
                description: |-
                  Alerts are the inbound alerts recorded on the Page, oldest first. A
                  resolved alert is marked resolved rather than removed, so the Page keeps
                  the history of what joined it.
                items:
                  description: |-
                    AlertTrigger records one inbound alert that opened or joined a Page. It keeps
                    the sender and the alert's own timing, which the Page's Trigger does not,
                    so a resolved alert can be closed without losing the Kubernetes evidence.
                  properties:
                    endsAt:
                      description: EndsAt is when the sender says the alert resolved.
                      format: date-time
                      type: string
                    fingerprint:
                      description: Fingerprint is the sender's stable alert identity.
                      maxLength: 256
                      type: string
                    sender:
                      description: Sender names the configured sender, such as alertmanager
                        or grafana.
                      maxLength: 128
                      type: string
                    severity:
                      description: Severity is the alert's severity, mapped to the
                        Page vocabulary.
                      enum:
                      - info
                      - warning
                      - critical
                      type: string
                    source:
                      description: Source is the sender dialect that delivered the
                        alert.
                      enum:
                      - Event
                      - Condition
                      - Alertmanager
                      - Grafana
                      - Datadog
                      - SNS
                      - CLI
                      - Portal
                      - API
                      type: string
                    startsAt:
                      description: StartsAt is when the sender says the alert started
