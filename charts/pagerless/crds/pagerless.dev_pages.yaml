                      format: date-time
                      type: string
                    state:
                      description: State is whether the alert is firing or resolved.
                      enum:
                      - Firing
                      - Resolved
                      type: string
                  required:
                  - source
                  - state
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: Conditions describe the Page's state in machine-readable
