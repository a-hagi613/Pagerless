---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: pages.pagerless.dev
spec:
  group: pagerless.dev
  names:
    categories:
    - pagerless
    kind: Page
    listKind: PageList
    plural: pages
    shortNames:
    - pg
    singular: page
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.target.name
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.trigger.source
      name: Trigger
      type: string
    - jsonPath: .status.pullRequest.number
      name: PR
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.target.kind
      name: Kind
      priority: 1
      type: string
    - jsonPath: .spec.target.namespace
      name: Namespace
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Page is one investigation of one failing Target, from Trigger
          to verified outcome.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PageSpec describes what to investigate. It is immutable after
              creation.
            properties:
              excludedProposalHashes:
                description: |-
                  ExcludedProposalHashes are Proposal hashes that this Page must not propose
                  again. A Recurrence excludes the Proposal hash of the Page that recorded
                  NotRecovered, so that the same change cannot be proposed forever.
                items:
                  pattern: ^[0-9a-f]{64}$
                  type: string
                maxItems: 10
                type: array
                x-kubernetes-list-type: atomic
              fingerprint:
                description: |-
                  Fingerprint is the stable failure identity. It deliberately excludes
                  messages, timestamps, and repetition counts, so that one crash loop is
                  one failure rather than hundreds.
                pattern: ^[0-9a-f]{64}$
                type: string
              hint:
                description: Hint is optional guidance from the operator, passed to
                  the agent as human input.
                maxLength: 1000
                type: string
              previousPage:
                description: PreviousPage links a Recurrence to the Page that recorded
                  the previous outcome.
                maxLength: 253
                type: string
              repository:
                description: Repository is the declared Target Repository. Empty lets
                  resolution decide.
                properties:
                  branch:
                    description: Branch is the branch a Proposal targets. It defaults
                      to main.
                    maxLength: 253
                    type: string
                  path:
                    description: Path is the Target's manifest path inside the repository,
                      relative to its root.
                    maxLength: 500
                    type: string
                  url:
                    description: URL is the HTTPS Git URL, for example https://github.com/acme/gitops.
                    maxLength: 500
                    pattern: ^https://
                    type: string
                type: object
              target:
                description: Target is the failing object.
                properties:
                  apiVersion:
                    description: APIVersion is the Target's API version, such as apps/v1.
                    maxLength: 253
                    type: string
                  kind:
                    description: Kind is the Target's kind.
                    enum:
                    - Deployment
                    - StatefulSet
                    - DaemonSet
                    - Job
                    - CronJob
                    - Pod
                    - PersistentVolumeClaim
                    - Node
                    type: string
                  name:
                    description: Name is the Target's name.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace is the Target's namespace. It is empty
                      only for a Node.
                    maxLength: 63
                    type: string
                  uid:
                    description: |-
                      UID is the Target's UID. It distinguishes a recreated object from the
                      object it replaced.
                    pattern: ^[0-9a-fA-F-]{36}$
                    type: string
                required:
                - kind
                - name
                - namespace
                type: object
                x-kubernetes-validations:
                - message: namespace must be set for a namespaced kind and empty for
                    Node
                  rule: 'self.kind == ''Node'' ? (!has(self.namespace) || size(self.namespace)
                    == 0) : (has(self.namespace) && size(self.namespace) > 0)'
              trigger:
                description: Trigger is the observation that opened the Page.
                properties:
                  alertFingerprint:
                    description: AlertFingerprint is the upstream alert fingerprint,
                      when one exists.
                    maxLength: 128
                    type: string
                  message:
                    description: Message is the human-readable text at first observation.
                    maxLength: 1024
                    type: string
                  pod:
                    description: Pod is the pod that raised the Trigger. It is evidence,
                      not the Target.
                    maxLength: 253
                    type: string
                  reason:
                    description: Reason is the machine-readable cause, such as CrashLoopBackOff.
                    maxLength: 128
                    type: string
                  source:
                    description: Source is what opened or joined the Page.
                    enum:
                    - Event
                    - Condition
                    - Alertmanager
                    - Grafana
                    - Datadog
                    - SNS
                    - CLI
                    - Portal
                    - API
                    type: string
                required:
                - source
                type: object
            required:
            - fingerprint
            - target
            - trigger
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: PageStatus is the observed state of a Page. Only pagerless-server
              writes it (ADR-0001).
            properties:
              agentJobName:
                description: AgentJobName is the name of the agent Job.
                maxLength: 253
                type: string
              conditions:
                description: Conditions describe the Page's state in machine-readable
                  form.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cooldown:
                description: Cooldown records when the same Fingerprint may open a
                  new Page.
                properties:
                  backoffLevel:
                    description: |-
                      BackoffLevel is the Cooldown level this Page used: 0 for fifteen minutes
                      through 5 for the eight-hour cap. It is the value SQLite reported when the
                      Page opened.
                    format: int32
                    maximum: 5
                    minimum: 0
                    type: integer
                  lastPagedAt:
                    description: LastPagedAt is when this Page opened.
                    format: date-time
                    type: string
                  nextEligibleAt:
                    description: NextEligibleAt is when the same Fingerprint may open
                      a new Page.
                    format: date-time
                    type: string
                  recurrenceCount:
                    description: RecurrenceCount is the number of Pages recorded for
                      this Fingerprint, including this one.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              decision:
                description: Decision is the human decision on the current Proposal.
                properties:
                  decidedAt:
                    description: DecidedAt is when the decision was made.
                    format: date-time
                    type: string
                  decidedBy:
                    description: |-
                      DecidedBy is the identity the caller declared. Its trust is the caller's
                      RBAC on Pages, because the standalone chart installs no admission webhook
                      to stamp an authentic identity.
                    maxLength: 253
                    type: string
                  outcome:
                    description: Outcome is the decision.
                    enum:
                    - Approved
                    - Rejected
                    type: string
                  proposalHash:
                    description: ProposalHash binds the decision to one Proposal.
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  reason:
                    description: Reason is the optional reason the human gave.
                    maxLength: 1000
                    type: string
                required:
                - decidedAt
                - decidedBy
                - outcome
                - proposalHash
                type: object
              diagnosis:
                description: Diagnosis is the agent's root-cause conclusion.
                maxLength: 4000
                type: string
              findings:
                description: Findings are the cited evidence the agent reported.
                items:
                  description: Finding is one cited piece of evidence that supports
                    a Diagnosis.
                  properties:
                    kind:
                      description: Kind classifies the evidence.
                      enum:
                      - Log
                      - Metric
                      - Trace
                      - Event
                      - Commit
                      type: string
                    source:
                      description: Source cites where the evidence came from, such
                        as a tool call and its query.
                      maxLength: 300
                      minLength: 1
                      type: string
                    summary:
                      description: Summary states what the evidence shows.
                      maxLength: 500
                      minLength: 1
                      type: string
                  required:
                  - kind
                  - source
                  - summary
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              fingerprints:
                description: |-
                  Fingerprints are the distinct failure Fingerprints observed on the Subject,
                  capped so a crash storm cannot grow the Page without bound.
                items:
                  description: FingerprintEntry mirrors one failure Fingerprint of
                    a Page.
                  properties:
                    fingerprint:
                      description: Fingerprint is the domain-separated SHA-256 of
                        the failure, as lowercase hex.
                      pattern: ^[0-9a-f]{64}$
                      type: string
                    occurrences:
                      description: Occurrences counts the observations aggregated
                        into this Fingerprint.
                      format: int32
                      minimum: 0
                      type: integer
                    reasonClass:
                      description: ReasonClass is the catalog constant that classified
                        the failure.
                      maxLength: 64
                      type: string
                    scope:
                      description: Scope is the container name or condition type,
                        or empty.
                      maxLength: 253
                      type: string
                    state:
                      description: State is the Fingerprint's state.
                      enum:
                      - observing
                      - paged
                      - clearing
                      - resolved
                      type: string
                  required:
                  - fingerprint
                  - reasonClass
                  - state
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              investigation:
                description: |-
                  Investigation reports whether the investigation is running, queued, or
                  suppressed by a guardrail. It is empty for a Page a human opened.
                properties:
                  job:
                    description: Job is the agent Job's name once the investigation
                      starts.
                    maxLength: 253
                    type: string
                  reason:
                    description: Reason says why a suppressed or queued investigation
                      waits.
                    maxLength: 32
                    type: string
                  state:
                    description: State is the investigation's state.
                    enum:
                    - Queued
                    - Running
                    - Suppressed
                    - Completed
                    type: string
                required:
                - state
                type: object
              lastTriggerAt:
                description: LastTriggerAt is when the most recent Trigger joined
                  the Page.
                format: date-time
                type: string
              narrative:
                description: |-
                  Narrative is the short, purely descriptive account of the Page written after Verification. It never
                  affects the outcome.
                maxLength: 4000
                type: string
              narrativeJobName:
                description: NarrativeJobName is the name of the Job that writes the
                  Narrative after Verification.
                maxLength: 253
                type: string
              observedGeneration:
                description: ObservedGeneration is the Page generation that this status
                  reflects.
                format: int64
                type: integer
              phase:
                description: Phase is the stage the Page is in.
                enum:
                - Pending
                - Investigating
                - Proposed
                - Approved
                - PullRequestOpen
                - Verifying
                - Recovered
                - NotRecovered
                - Diagnosed
                - Rejected
                - Expired
                - Invalid
                - Superseded
                - Failed
                type: string
              primaryFingerprint:
                description: |-
                  PrimaryFingerprint is the Fingerprint that opened the Page. Additional
                  Fingerprints a second Trigger contributed are in Fingerprints.
                pattern: ^[0-9a-f]{64}$
                type: string
              proposal:
                description: Proposal is the current Proposal.
                properties:
                  action:
                    description: Action is the remediation.
                    enum:
                    - Scale
                    - PatchResources
                    - Rollback
                    - NoAction
                    type: string
                  attempt:
                    description: Attempt is 1 for the first Proposal the agent submitted
                      and 2 for its revision.
                    format: int32
                    maximum: 2
                    minimum: 1
                    type: integer
                  base:
                    description: Base is the state the change was rendered against.
                    properties:
                      commit:
                        description: Commit is the Target Repository commit the patch
                          applies to.
                        maxLength: 64
                        type: string
                      targetGeneration:
                        description: TargetGeneration is the Target's metadata.generation
                          when the Proposal was rendered.
                        format: int64
                        type: integer
                    type: object
                  diagnosisOnlyReason:
                    description: DiagnosisOnlyReason explains why no change is recommended.
                    maxLength: 1000
                    type: string
                  expiresAt:
                    description: ExpiresAt is when an unapproved Proposal expires.
                    format: date-time
                    type: string
                  files:
                    description: Files are the whole-file changes of a FilePatch Proposal.
                    items:
                      description: |-
                        FileEdit is one whole-file change against the recorded base commit. The Page
                        records the file's identity and the digest of its new content; the content
                        itself is held by the server under that digest, so that Page status stays
                        small and never carries repository bytes. The server derives the Diff from
                        the content, so a model-supplied patch cannot be inconsistent with the base.
                      properties:
                        baseBlob:
                          description: BaseBlob is the Git blob SHA of the file at
                            the recorded base commit.
                          pattern: ^[0-9a-f]{40,64}$
                          type: string
                        contentDigest:
                          description: |-
                            ContentDigest is the lowercase hexadecimal SHA-256 digest of the complete
                            new content of the file.
                          pattern: ^[0-9a-f]{64}$
                          type: string
                        path:
                          description: Path is the Target Repository path, relative
                            to the repository root.
                          maxLength: 500
                          minLength: 1
                          type: string
                        rationale:
                          description: Rationale states why this file is the edit
                            target for the Diagnosis.
                          maxLength: 300
                          minLength: 1
                          type: string
                      required:
                      - baseBlob
                      - contentDigest
                      - path
                      - rationale
                      type: object
                    maxItems: 5
                    type: array
                    x-kubernetes-list-type: atomic
                  hash:
                    description: Hash binds an Approval to this exact Proposal. It
                      is a lowercase hexadecimal SHA-256 digest.
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  kind:
                    description: |-
                      Kind is the form of the Proposal. It is FilePatch for the v2 agent, DiagnosisOnly when no change is
                      recommended, and Action for a v1 fixed-Action Proposal.
                    enum:
                    - FilePatch
                    - DiagnosisOnly
                    - Action
                    type: string
                  parameters:
                    description: Parameters are the typed parameters of the Action.
                    maxProperties: 1
                    properties:
                      patchResources:
                        description: PatchResources holds the parameters of the PatchResources
                          Action.
                        properties:
                          container:
                            description: Container names the container to patch.
                            maxLength: 63
                            minLength: 1
                            type: string
                          limits:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: Limits are the desired resource limits.
                            type: object
                          requests:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: Requests are the desired resource requests.
                            type: object
                        required:
                        - container
                        type: object
                      rollback:
                        description: Rollback holds the parameters of the Rollback
                          Action.
                        properties:
                          commit:
                            description: |-
                              Commit is the Target Repository commit to revert. It must be among the last
                              20 commits touching the Target's path or a declared dependency path.
                            maxLength: 64
                            minLength: 7
                            pattern: ^[0-9a-f]+$
                            type: string
                        required:
                        - commit
                        type: object
                      scale:
                        description: Scale holds the parameters of the Scale Action.
                        properties:
                          replicas:
                            description: Replicas is the desired replica count.
                            format: int32
                            minimum: 0
                            type: integer
                        required:
                        - replicas
                        type: object
                    type: object
                  renderedChange:
                    description: RenderedChange is the exact change that Validation
                      rendered.
                    properties:
                      patch:
                        description: Patch is the git patch against the recorded base
                          commit.
                        maxLength: 32768
                        type: string
                      path:
                        description: Path is the Target Repository path that the patch
                          changes.
                        maxLength: 500
                        type: string
                    type: object
                  validation:
                    description: Validation is the deterministic Validation report
                      for this Proposal.
                    properties:
                      admission:
                        description: Admission states the one line that the Page shows
                          about admission, quota, and defaulting.
                        maxLength: 120
                        type: string
                      degraded:
                        description: |-
                          Degraded reports that OpenAPI schema validation could not run, so the Proposal is approvable but not
                          eligible for an unattended draft.
                        type: boolean
                      errors:
                        description: Errors are the refusals.
                        items:
                          description: ProposalValidationError is one reason Validation
                            refused a Proposal.
                          properties:
                            field:
                              description: Field names the offending part of the Proposal.
                              maxLength: 200
                              type: string
                            message:
                              description: Message explains the refusal.
                              maxLength: 300
                              minLength: 1
                              type: string
                          required:
                          - field
                          - message
                          type: object
                        maxItems: 10
                        type: array
                        x-kubernetes-list-type: atomic
                      passed:
                        description: Passed reports whether Validation accepted the
                          Proposal.
                        type: boolean
                      warnings:
                        description: Warnings are permitted changes that the Operator
                          must review.
                        items:
                          description: ProposalWarning is a permitted change that
                            is recorded on the Page and carried into the Pull Request
                            body.
                          properties:
                            class:
                              description: Class classifies the warning.
                              enum:
                              - Image
                              - Replicas
                              - ReplicasZero
                              - NodePlacement
                              - ResourceRemoval
                              - Degraded
                              type: string
                            field:
                              description: Field names the document field the warning
                                is about.
                              maxLength: 200
                              type: string
                            message:
                              description: Message explains the warning.
                              maxLength: 300
                              minLength: 1
                              type: string
                          required:
                          - class
                          - field
                          - message
                          type: object
                        maxItems: 10
                        type: array
                        x-kubernetes-list-type: atomic
                    required:
                    - passed
                    type: object
                required:
                - action
                - attempt
                - expiresAt
                - hash
                type: object
                x-kubernetes-validations:
                - message: parameters.scale must be set exactly when the action is
                    Scale
                  rule: 'self.action == ''Scale'' ? (has(self.parameters) && has(self.parameters.scale))
                    : (!has(self.parameters) || !has(self.parameters.scale))'
                - message: parameters.patchResources must be set exactly when the
                    action is PatchResources
                  rule: 'self.action == ''PatchResources'' ? (has(self.parameters)
                    && has(self.parameters.patchResources)) : (!has(self.parameters)
                    || !has(self.parameters.patchResources))'
                - message: parameters.rollback must be set exactly when the action
                    is Rollback
                  rule: 'self.action == ''Rollback'' ? (has(self.parameters) && has(self.parameters.rollback))
                    : (!has(self.parameters) || !has(self.parameters.rollback))'
              pullRequest:
                description: PullRequest is the pull request that carries the approved
                  Proposal.
                properties:
                  branch:
                    description: Branch is the branch that carries the Proposal.
                    maxLength: 253
                    type: string
                  checks:
                    description: Checks is the aggregate state of the repository's
                      CI.
                    enum:
                    - Pending
                    - Passing
                    - Failing
                    - Unknown
                    type: string
                  headSHA:
                    description: HeadSHA is the commit the branch points at.
                    maxLength: 64
                    type: string
                  mergeCommit:
                    description: MergeCommit is the commit the merge produced.
                    maxLength: 64
                    type: string
                  mergedAt:
                    description: MergedAt is when the pull request merged.
                    format: date-time
                    type: string
                  number:
                    description: Number is the pull request number.
                    format: int32
                    minimum: 0
                    type: integer
                  openedAt:
                    description: OpenedAt is when the pull request was opened.
                    format: date-time
                    type: string
                  provider:
                    description: Provider is the code host. It is GitHub in v2.
                    maxLength: 64
                    type: string
                  state:
                    description: State is the provider's view of the pull request.
                    enum:
                    - Draft
                    - Open
                    - Merged
                    - Closed
                    type: string
                  url:
                    description: URL is the address of the pull request page.
                    maxLength: 500
                    type: string
                type: object
              repository:
                description: Repository is the resolved Target Repository, as the
                  provenance ladder found it.
                properties:
                  ambiguous:
                    description: |-
                      Ambiguous reports that two or more candidates are rank-equal, so the model
                      must choose one and Validation must check the choice.
                    type: boolean
                  attempts:
                    description: |-
                      Attempts records what every rung did, in ladder order. Nine rungs can run, and a
                      final attempt records that none of them resolved the Target.
                    items:
                      description: |-
                        ResolutionAttempt records one rung's outcome, so that an operator can see why
                        a weaker rung produced the answer.
                      properties:
                        outcome:
                          description: Outcome is what the rung did.
                          enum:
                          - Resolved
                          - Failed
                          - Skipped
                          type: string
                        reason:
                          description: Reason explains a failure or a skip in one
                            sentence.
                          maxLength: 200
                          type: string
                        source:
                          description: Source is the rung.
                          enum:
                          - Hint
                          - ArgoCDTrackingID
                          - ArgoCDInstance
                          - FluxKustomization
                          - FluxHelmRelease
                          - HelmMetadata
                          - ConfiguredMapping
                          - IdentitySearch
                          - None
                          type: string
                      required:
                      - outcome
                      - source
                      type: object
                    maxItems: 10
                    type: array
                    x-kubernetes-list-type: atomic
                  baseCommit:
                    description: |-
                      BaseCommit is the commit the Resolution was computed at and a Proposal is
                      rendered against.
                    maxLength: 64
                    type: string
                  branch:
                    description: Branch is the resolved branch.
                    maxLength: 253
                    type: string
                  candidates:
                    description: Candidates are the rank-equal candidates of an ambiguous
                      Resolution.
                    items:
                      description: |-
                        ResolutionCandidate is one legitimate file pair for an ambiguous Resolution.
                        The model chooses among candidates and Validation checks the choice.
                      properties:
                        editTarget:
                          description: EditTarget is the file that a change should
                            go to.
                          maxLength: 500
                          type: string
                        editTargetKind:
                          description: EditTargetKind is the kind of EditTarget.
                          enum:
                          - OverlayPatch
                          - OverlayResource
                          - FluxPatch
                          - ArgoValues
                          - BaseManifest
                          - HelmValues
                          type: string
                        path:
                          description: Path is the file that defines the failing object.
                          maxLength: 500
                          type: string
                      required:
                      - editTarget
                      - editTargetKind
                      - path
                      type: object
