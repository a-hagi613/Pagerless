                    maxLength: 253
                    type: string
                  outcome:
                    description: Outcome is the decision.
                    enum:
                    - Approved
                    - Rejected
                    type: string
                  proposalHash:
                    description: ProposalHash binds the decision to one Proposal.
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  reason:
                    description: Reason is the optional reason the human gave.
                    maxLength: 1000
                    type: string
                required:
                - decidedAt
                - decidedBy
                - outcome
                - proposalHash
                type: object
              diagnosis:
                description: Diagnosis is the agent's root-cause conclusion.
                maxLength: 4000
                type: string
              evidence:
                description: |-
                  Evidence summarizes the stored Context Bundle. The bundle body stays out
                  of the Page object.
                properties:
                  bundleHash:
                    description: BundleHash is the SHA-256 of the stored bundle content.
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  bytes:
                    description: Bytes is the serialized bundle size.
                    format: int64
                    minimum: 0
                    type: integer
                  collectedAt:
                    description: CollectedAt is when the bundle was assembled.
                    format: date-time
                    type: string
                  connectors:
                    description: Connectors names the producing Connectors, in assembly
                      order.
                    items:
                      type: string
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: atomic
                  notes:
                    description: Notes record a degraded Connector or a truncation.
                    items:
                      type: string
                    maxItems: 10
                    type: array
                    x-kubernetes-list-type: atomic
                  redactions:
                    description: Redactions is the number of sanitized values.
                    format: int32
                    minimum: 0
                    type: integer
                  truncated:
                    description: Truncated reports whether a cap dropped evidence.
                    type: boolean
                required:
                - bundleHash
                type: object
              findings:
                description: Findings are the cited evidence the agent reported.
                items:
                  description: Finding is one cited piece of evidence that supports
                    a Diagnosis.
                  properties:
                    kind:
                      description: Kind classifies the evidence.
                      enum:
                      - Log
                      - Metric
                      - Trace
                      - Event
                      - Commit
                      type: string
                    pointer:
                      description: |-
                        Pointer is the JSON Pointer into the recorded tool result that the
                        Finding cites. The server verifies that it resolves.
                      maxLength: 500
                      type: string
                    source:
                      description: Source cites where the evidence came from, such
                        as a tool call and its query.
                      maxLength: 300
                      minLength: 1
                      type: string
                    summary:
                      description: Summary states what the evidence shows.
                      maxLength: 500
                      minLength: 1
                      type: string
                    toolCallId:
                      description: |-
                        ToolCallID names the recorded tool call the evidence came from. The
                        server verifies it exists for this Page before accepting the Finding.
                      maxLength: 128
                      type: string
                  required:
                  - kind
                  - source
                  - summary
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              fingerprints:
                description: |-
                  Fingerprints are the distinct failure Fingerprints observed on the Subject,
                  capped so a crash storm cannot grow the Page without bound.
                items:
                  description: FingerprintEntry mirrors one failure Fingerprint of
                    a Page.
                  properties:
                    fingerprint:
                      description: Fingerprint is the domain-separated SHA-256 of
                        the failure, as lowercase hex.
                      pattern: ^[0-9a-f]{64}$
                      type: string
                    occurrences:
                      description: Occurrences counts the observations aggregated
                        into this Fingerprint.
                      format: int32
                      minimum: 0
                      type: integer
                    reasonClass:
                      description: ReasonClass is the catalog constant that classified
                        the failure.
                      maxLength: 64
                      type: string
                    scope:
                      description: Scope is the container name or condition type,
                        or empty.
                      maxLength: 253
                      type: string
                    state:
                      description: State is the Fingerprint's state.
                      enum:
                      - observing
                      - paged
                      - clearing
                      - resolved
                      type: string
                  required:
                  - fingerprint
                  - reasonClass
                  - state
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              investigation:
                description: |-
                  Investigation reports whether the investigation is running, queued, or
                  suppressed by a guardrail. It is empty for a Page a human opened.
                properties:
                  job:
                    description: Job is the agent Job's name once the investigation
                      starts.
                    maxLength: 253
                    type: string
                  reason:
                    description: Reason says why a suppressed or queued investigation
                      waits.
                    maxLength: 32
                    type: string
                  state:
                    description: State is the investigation's state.
                    enum:
                    - Queued
                    - Running
                    - Suppressed
                    - Completed
                    type: string
                required:
                - state
                type: object
              lastTriggerAt:
                description: LastTriggerAt is when the most recent Trigger joined
                  the Page.
                format: date-time
                type: string
              narrative:
                description: |-
                  Narrative is the short, purely descriptive account of the Page written after Verification. It never
                  affects the outcome.
                maxLength: 4000
                type: string
              narrativeJobName:
                description: NarrativeJobName is the name of the Job that writes the
                  Narrative after Verification.
                maxLength: 253
                type: string
              observedGeneration:
                description: ObservedGeneration is the Page generation that this status
                  reflects.
                format: int64
                type: integer
              phase:
                description: Phase is the stage the Page is in.
                enum:
                - Pending
                - Investigating
                - Proposed
                - Approved
                - PullRequestOpen
                - Verifying
                - Recovered
                - NotRecovered
                - Diagnosed
                - Rejected
                - Expired
                - Invalid
                - Superseded
                - Failed
                type: string
              primaryFingerprint:
                description: |-
                  PrimaryFingerprint is the Fingerprint that opened the Page. Additional
                  Fingerprints a second Trigger contributed are in Fingerprints.
                pattern: ^[0-9a-f]{64}$
                type: string
              proposal:
                description: Proposal is the current Proposal.
                properties:
                  action:
                    description: Action is the remediation.
                    enum:
                    - FilePatch
                    - Scale
                    - PatchResources
                    - Rollback
                    - NoAction
                    type: string
                  attempt:
                    description: Attempt is 1 for the first Proposal the agent submitted
                      and 2 for its revision.
                    format: int32
                    maximum: 2
                    minimum: 1
                    type: integer
                  base:
                    description: Base is the state the change was rendered against.
                    properties:
                      commit:
                        description: Commit is the Target Repository commit the patch
                          applies to.
                        maxLength: 64
                        type: string
                      targetGeneration:
                        description: TargetGeneration is the Target's metadata.generation
                          when the Proposal was rendered.
                        format: int64
                        type: integer
                    type: object
                  diagnosisOnlyReason:
                    description: DiagnosisOnlyReason explains why no change is recommended.
                    maxLength: 1000
                    type: string
                  expiresAt:
                    description: ExpiresAt is when an unapproved Proposal expires.
                    format: date-time
                    type: string
                  files:
                    description: Files are the whole-file changes of a FilePatch Proposal.
                    items:
                      description: |-
                        FileEdit is one whole-file change against the recorded base commit. The Page
                        records the file's identity and the digest of its new content; the content
                        itself is held by the server under that digest, so that Page status stays
                        small and never carries repository bytes. The server derives the Diff from
                        the content, so a model-supplied patch cannot be inconsistent with the base.
                      properties:
                        baseBlob:
                          description: BaseBlob is the Git blob SHA of the file at
                            the recorded base commit.
                          pattern: ^[0-9a-f]{40,64}$
                          type: string
                        contentDigest:
                          description: |-
                            ContentDigest is the lowercase hexadecimal SHA-256 digest of the complete
                            new content of the file.
                          pattern: ^[0-9a-f]{64}$
                          type: string
                        path:
                          description: Path is the Target Repository path, relative
                            to the repository root.
                          maxLength: 500
                          minLength: 1
                          type: string
                        rationale:
                          description: Rationale states why this file is the edit
                            target for the Diagnosis.
                          maxLength: 300
                          minLength: 1
                          type: string
                        updatedContent:
                          description: |-
                            UpdatedContent is the complete new content the model supplied. The Page
                            stores only its digest; the server holds the content under the Proposal
                            hash so that status stays small.
                          type: string
                      required:
                      - baseBlob
                      - contentDigest
                      - path
                      - rationale
                      type: object
                    maxItems: 5
                    type: array
                    x-kubernetes-list-type: atomic
                  hash:
                    description: Hash binds an Approval to this exact Proposal. It
                      is a lowercase hexadecimal SHA-256 digest.
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  kind:
                    description: |-
                      Kind is the form of the Proposal. It is FilePatch for the v2 agent, DiagnosisOnly when no change is
                      recommended, and Action for a v1 fixed-Action Proposal.
                    enum:
                    - FilePatch
                    - DiagnosisOnly
                    - Action
                    type: string
                  parameters:
                    description: Parameters are the typed parameters of the Action.
                    maxProperties: 1
                    properties:
                      filePatch:
                        description: FilePatch holds the parameters of the FilePatch
                          Action.
                        properties:
                          confidence:
                            description: |-
                              Confidence records how the edit target was chosen. It is empty when the
                              model did not state one.
                            enum:
                            - exact
                            - configured
                            - identity
                            - name-only
                            type: string
                          files:
                            description: Files are the whole-file changes, in the
                              order the model proposed them.
                            items:
                              description: |-
                                FileEdit is one whole-file change against the recorded base commit. The Page
                                records the file's identity and the digest of its new content; the content
                                itself is held by the server under that digest, so that Page status stays
                                small and never carries repository bytes. The server derives the Diff from
                                the content, so a model-supplied patch cannot be inconsistent with the base.
                              properties:
                                baseBlob:
                                  description: BaseBlob is the Git blob SHA of the
                                    file at the recorded base commit.
                                  pattern: ^[0-9a-f]{40,64}$
                                  type: string
                                contentDigest:
                                  description: |-
                                    ContentDigest is the lowercase hexadecimal SHA-256 digest of the complete
                                    new content of the file.
                                  pattern: ^[0-9a-f]{64}$
                                  type: string
                                path:
                                  description: Path is the Target Repository path,
                                    relative to the repository root.
                                  maxLength: 500
                                  minLength: 1
                                  type: string
                                rationale:
                                  description: Rationale states why this file is the
                                    edit target for the Diagnosis.
                                  maxLength: 300
                                  minLength: 1
                                  type: string
                                updatedContent:
                                  description: |-
                                    UpdatedContent is the complete new content the model supplied. The Page
                                    stores only its digest; the server holds the content under the Proposal
                                    hash so that status stays small.
                                  type: string
                              required:
                              - baseBlob
                              - contentDigest
                              - path
                              - rationale
                              type: object
                            maxItems: 5
                            minItems: 1
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                        - files
                        type: object
                      patchResources:
                        description: PatchResources holds the parameters of the PatchResources
                          Action.
                        properties:
                          container:
                            description: Container names the container to patch.
                            maxLength: 63
                            minLength: 1
                            type: string
                          limits:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: Limits are the desired resource limits.
                            type: object
                          requests:
                            additionalProperties:
                              anyOf:
                              - type: integer
                              - type: string
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            description: Requests are the desired resource requests.
                            type: object
                        required:
                        - container
                        type: object
                      rollback:
                        description: Rollback holds the parameters of the Rollback
                          Action.
                        properties:
                          commit:
                            description: |-
                              Commit is the Target Repository commit to revert. It must be among the last
                              20 commits touching the Target's path or a declared dependency path.
                            maxLength: 64
                            minLength: 7
                            pattern: ^[0-9a-f]+$
                            type: string
                        required:
                        - commit
                        type: object
                      scale:
                        description: Scale holds the parameters of the Scale Action.
                        properties:
                          replicas:
                            description: Replicas is the desired replica count.
                            format: int32
                            minimum: 0
                            type: integer
                        required:
                        - replicas
                        type: object
                    type: object
                  reason:
                    description: |-
                      Reason explains a DiagnosisOnly conclusion. It is set only alongside
                      ActionNoAction, and it is empty for a report that supplied no reason.
                    maxLength: 1000
                    type: string
                  recommendation:
                    description: Recommendation is the action a human should take
                      for a DiagnosisOnly conclusion.
                    maxLength: 2000
                    type: string
                  renderedChange:
                    description: RenderedChange is the exact change that Validation
                      rendered.
                    properties:
                      patch:
                        description: Patch is the git patch against the recorded base
                          commit.
                        maxLength: 32768
                        type: string
                      path:
                        description: Path is the Target Repository path that the patch
                          changes.
                        maxLength: 500
                        type: string
                    type: object
                  validation:
                    description: Validation is the deterministic Validation report
