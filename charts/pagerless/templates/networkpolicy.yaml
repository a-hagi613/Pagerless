{{- if .Values.networkPolicy.enabled }}
# The server is reachable inside the cluster and through a port-forward; every
# request still needs the installer's operator token. The agent and the MCP
# integrations accept traffic only from the server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pagerless.fullname" . }}-server
  labels:
    {{- include "pagerless.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pagerless.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "pagerless.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.agent.port }}
          protocol: TCP
        - port: {{ .Values.mcp.port }}
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pagerless.fullname" . }}-agent
  labels:
    {{- include "pagerless.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pagerless.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "pagerless.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.agent.port }}
          protocol: TCP
  egress:
    # The agent calls a model endpoint the operator supplies, whose address and
    # port the chart cannot know. DNS plus the public web ports cover the
    # documented endpoints; an in-cluster endpoint on another port needs an
    # additional egress rule.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pagerless.fullname" . }}-mcp
  labels:
    {{- include "pagerless.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - {{ include "pagerless.name" . }}
      - key: app.kubernetes.io/component
        operator: In
        values:
          - kubernetes-mcp
          - github-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "pagerless.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.mcp.port }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
{{- end }}
