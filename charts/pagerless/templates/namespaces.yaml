{{- /*
Workload namespaces, created only on request. The release namespace is never
rendered here: Helm creates it with --create-namespace, and a second object for
the same namespace would conflict with the release's own ownership.
*/ -}}
{{- if .Values.createWorkloadNamespaces }}
{{- range $namespace := .Values.workloadNamespaces }}
{{- if ne $namespace $.Release.Namespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless") | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
