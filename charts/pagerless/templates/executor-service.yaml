apiVersion: v1
kind: Service
metadata:
  name: pagerless-executor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-executor") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pagerless-executor
  ports:
    - name: http
      port: 8080
      targetPort: http
