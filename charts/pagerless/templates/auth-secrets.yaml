{{- /*
The two Secrets that token mode needs (ADR-0032): the bootstrap token the
operator exchanges for a session, and the HMAC-SHA256 key that signs session
cookies. Neither value ever passes through a Helm value.

Both Secrets are reused when they already exist, so an upgrade does not rotate a
token or sign every browser out. `helm.sh/resource-policy: keep` keeps them
across `helm uninstall`, which is what makes a reinstall preserve the session
key. An empty value in an existing Secret is replaced, so a Secret that a
previous render created without data is repaired.
*/ -}}
{{- include "pagerless.validateAuth" . }}
{{- if eq .Values.auth.mode "token" }}
{{- $adminName := .Values.auth.adminSecret.name }}
{{- $adminKey := .Values.auth.adminSecret.key }}
{{- $token := randAlphaNum (int .Values.auth.adminSecret.length) }}
{{- $existingAdmin := lookup "v1" "Secret" .Release.Namespace $adminName }}
{{- if $existingAdmin }}
{{- $data := default (dict) $existingAdmin.data }}
{{- $current := index $data $adminKey }}
{{- if $current }}
{{- $token = $current | b64dec }}
{{- end }}
{{- end }}
{{- if .Values.auth.adminSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $adminName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-admin-secret") | nindent 4 }}
  {{- if .Values.auth.adminSecret.keep }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  {{ $adminKey }}: {{ $token | quote }}
{{- end }}
---
{{- $sessionName := .Values.auth.session.secretName }}
{{- $sessionKeyName := .Values.auth.session.key }}
{{- $sessionKey := randAlphaNum 64 }}
{{- $existingSession := lookup "v1" "Secret" .Release.Namespace $sessionName }}
{{- if $existingSession }}
{{- $data := default (dict) $existingSession.data }}
{{- $current := index $data $sessionKeyName }}
{{- if $current }}
{{- $sessionKey = $current | b64dec }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sessionName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-session-key") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $sessionKeyName }}: {{ $sessionKey | quote }}
{{- end }}
