{{- /*
Service accounts. pagerless-server writes Triage status and creates agent Jobs;
the agent holds no Kubernetes API credential; the Executor holds the only write
credentials (ADR-0005).
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pagerless-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 4 }}
---
# The agent runs as this service account. It is bound to no Role, so it holds
# no write permissions; its projected tokens only prove its identity to
# pagerless-server and to Keycloak (ADR-0001, ADR-0022). The annotations carry a
# Pod Identity or IRSA binding for the model provider without a stored
# credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pagerless-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-agent") | nindent 4 }}
  {{- with .Values.agent.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
# pagerless-executor needs the Kubernetes API to read Triages and
# TriageApprovals and to carry out RestartWorkload, so its token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pagerless-executor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-executor") | nindent 4 }}
