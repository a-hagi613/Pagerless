{{- /*
Two service accounts. pagerless-server writes Pages and creates the agent Jobs;
the agent holds no Kubernetes RBAC at all, so its ServiceAccount is bound to no
Role or ClusterRole and never mounts an automatic API token. Its only token is
the projected per-Page token that the server authenticates (ADR-0030).
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pagerless-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-agent") | nindent 4 }}
automountServiceAccountToken: false
