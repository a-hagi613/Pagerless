apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pagerless.fullname" . }}
  labels:
    {{- include "pagerless.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pagerless.agentServiceName" . }}
  labels:
    {{- include "pagerless.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.kubernetes.enabled }}
---
# The Kubernetes integration is the only workload with a cluster identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-kubernetes-mcp" (include "pagerless.fullname" .) }}
  labels:
    {{- include "pagerless.labels" . | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-github-mcp" (include "pagerless.fullname" .) }}
  labels:
    {{- include "pagerless.labels" . | nindent 4 }}
automountServiceAccountToken: false
