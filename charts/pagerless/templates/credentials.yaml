{{- /*
The credentials Secret, rendered only when no externally managed Secret is
named. Every documented key is present and empty: the kubelet mounts a volume
whose keys exist, so the server reads "" instead of failing with ENOENT, and an
unconfigured installation is a normal state rather than an error path.

The chart does not put helm.sh/resource-policy: keep here. Uninstalling the
release should remove the credentials it created; a secret manager is the
answer for retention.
*/ -}}
{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-credentials") | nindent 4 }}
type: Opaque
stringData:
  AI_BASE_URL: ""
  AI_API_KEY: ""
  AI_MODEL: ""
  GITHUB_TOKEN: ""
  GITHUB_REPO: ""
  GITHUB_API_URL: ""
{{- end }}
