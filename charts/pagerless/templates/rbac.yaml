{{- /*
The cluster identity is strictly read-only (ADR-0037). It reads the cluster to
diagnose failures and writes only its own Pages, the agent Jobs that investigate
them, and the two Secrets the operator owns. Remediation is a pull request, so
no write verb on a workload, Event, or Node is ever rendered.

The same namespaced rules are rendered twice: once inside one cluster-wide read
ClusterRole (Mode A), and once as a read Role per allowlisted namespace (Mode B),
without the cluster-scoped rules. The two modes are mutually exclusive and are
validated before anything renders.
*/ -}}
{{- include "pagerless.validateWatch" . }}
{{- if .Values.rbac.create }}
{{- if .Values.rbac.watchAllNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-pagerless-read
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 4 }}
rules:
  {{- include "pagerless.namespacedReadRules" . | nindent 2 }}
  {{- include "pagerless.clusterReadRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-pagerless-read
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-pagerless-read
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range $namespace := .Values.rbac.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-pagerless-read
  namespace: {{ $namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 4 }}
rules:
  {{- include "pagerless.namespacedReadRules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-pagerless-read
  namespace: {{ $namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-pagerless-read
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.serviceAccount.name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
---
{{- /*
The release-namespace Role. Pages and their status are the product's own objects,
the agent Jobs are the investigations, and the two named Secrets are the only
Secrets the server may touch. `pods` is read again here so that Mode B can still
read the agent pod that presents a token.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pagerless-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 4 }}
rules:
  # `patch` lets the Portal record a decision as annotations on the Page under
  # the server's identity. `spec` is immutable and `status` is a separate
  # subresource, so a patch cannot change the investigation (ADR-0031).
  - apiGroups: [pagerless.dev]
    resources: [pages]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [pagerless.dev]
    resources: [pages/status]
    verbs: [get, update, patch]
  # Setting blockOwnerDeletion on the agent Job's owner reference.
  - apiGroups: [pagerless.dev]
    resources: [pages/finalizers]
    verbs: [update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # Two Secrets by name, never a list or a watch: `resourceNames` cannot
  # constrain them, so those verbs are never granted.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [pagerless-credentials, pagerless-admin-secret]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [pagerless-credentials]
    verbs: [update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pagerless-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pagerless-server
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
---
{{- /*
The approver Role. A decision is an annotation patch on the Page, so `patch` on
`pages` is the only write an approver holds; `spec` is immutable and `status` is
a separate subresource, so the decision cannot change the investigation
(ADR-0031).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pagerless-approver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-approver") | nindent 4 }}
rules:
  - apiGroups: [pagerless.dev]
    resources: [pages]
    verbs: [get, list, watch]
  - apiGroups: [pagerless.dev]
    resources: [pages]
    verbs: [patch]
{{- with .Values.approvers.subjects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pagerless-approvers
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-approver") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pagerless-approver
subjects:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
