# The Kubernetes integration reads workloads, Events and bounded logs. It has
# no Secret, exec, attach, proxy or mutating verb. Discovery is provided by the
# cluster's system:discovery binding to every authenticated identity.
{{- if .Values.kubernetes.enabled }}
{{- $readRules := list
  (dict "apiGroups" (list "") "resources" (list "pods" "services" "configmaps" "events" "namespaces" "nodes" "persistentvolumeclaims" "serviceaccounts") "verbs" (list "get" "list"))
  (dict "apiGroups" (list "") "resources" (list "pods/log") "verbs" (list "get"))
  (dict "apiGroups" (list "apps") "resources" (list "deployments" "replicasets" "statefulsets" "daemonsets") "verbs" (list "get" "list"))
  (dict "apiGroups" (list "batch") "resources" (list "jobs" "cronjobs") "verbs" (list "get" "list"))
  (dict "apiGroups" (list "networking.k8s.io") "resources" (list "ingresses" "networkpolicies") "verbs" (list "get" "list"))
  (dict "apiGroups" (list "autoscaling") "resources" (list "horizontalpodautoscalers") "verbs" (list "get" "list"))
  (dict "apiGroups" (list "policy") "resources" (list "poddisruptionbudgets") "verbs" (list "get" "list"))
-}}
{{- if .Values.kubernetes.namespaceAllowlist }}
{{- range .Values.kubernetes.namespaceAllowlist }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-kubernetes-mcp" (include "pagerless.fullname" $) }}
  namespace: {{ . }}
  labels:
    {{- include "pagerless.labels" $ | nindent 4 }}
rules:
  {{- toYaml $readRules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-kubernetes-mcp" (include "pagerless.fullname" $) }}
  namespace: {{ . }}
  labels:
    {{- include "pagerless.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-kubernetes-mcp" (include "pagerless.fullname" $) }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-kubernetes-mcp" (include "pagerless.fullname" $) }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-kubernetes-mcp" (include "pagerless.fullname" .) }}
  labels:
    {{- include "pagerless.labels" . | nindent 4 }}
rules:
  {{- toYaml $readRules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-kubernetes-mcp" (include "pagerless.fullname" .) }}
  labels:
    {{- include "pagerless.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-kubernetes-mcp" (include "pagerless.fullname" .) }}
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-kubernetes-mcp" (include "pagerless.fullname" .) }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
