{{- /*
pagerless-server is the only long-running process: the Page reconcilers, the
agent report API, and the metrics API. It runs one replica with the Recreate
strategy because it is the single writer of Page status (ADR-0001, ADR-0030).

No admission webhook is served, so there is no serving certificate, no
certificate bootstrap, and no webhook port (ADR-0037).
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagerless-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pagerless-server
  template:
    metadata:
      labels:
        {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: {{ include "pagerless.image" (dict "context" $ "image" .Values.images.server) }}
          imagePullPolicy: {{ .Values.images.server.pullPolicy }}
          args:
            - --namespace=$(POD_NAMESPACE)
            - --agent-image={{ include "pagerless.image" (dict "context" $ "image" .Values.images.agent) }}
            - --report-url=http://pagerless-server.{{ .Release.Namespace }}.svc:{{ .Values.service.reportPort }}
            - --report-bind-address=:{{ .Values.service.reportPort }}
            - --metrics-bind-address=:9090
            - --health-probe-bind-address=:8081
            - --history-path=/var/lib/pagerless/history.db
            - --target-namespaces={{ include "pagerless.allowlist" . }}
            - --patch-namespaces={{ include "pagerless.allowlist" . }}
            - --alert-namespaces={{ include "pagerless.allowlist" . }}
            # The watcher reads the same namespaces the read Role grants. Mode B
            # renders a namespaced Role with no cluster-scoped rules, so Node
            # faults are out of reach there and the observer is switched off
            # rather than left to fail its informer sync.
            - --watcher-namespaces-include={{ include "pagerless.allowlist" . }}
            {{- if not .Values.rbac.watchAllNamespaces }}
            - --watcher-node-pages-mode=ignore
            {{- end }}
            - --sandbox-url=
            - --argocd-url=
            - --alertmanager-url=
            - --connectors-config=/etc/pagerless/connectors/connectors.yaml
            - --webhook-alertmanager-token-file={{ .Values.credentials.mountPath }}/ALERTMANAGER_WEBHOOK_TOKEN
            - --webhook-grafana-secret-file={{ .Values.credentials.mountPath }}/GRAFANA_WEBHOOK_SECRET
            - --webhook-datadog-token-file={{ .Values.credentials.mountPath }}/DATADOG_WEBHOOK_TOKEN
            - --webhook-generic-token-file={{ .Values.credentials.mountPath }}/GENERIC_WEBHOOK_TOKEN
            - --dashboard-bind-address=:{{ .Values.service.port }}
            - --dashboard-base-url={{ .Values.dashboard.baseUrl }}
            - --dashboard-cookie-secure={{ .Values.auth.session.secure }}
            - --auth-mode={{ .Values.auth.mode }}
            - --auth-bearer-token={{ .Values.auth.bearerToken }}
            - --auth-identity-header={{ .Values.auth.proxy.identityHeader }}
            - --auth-session-ttl={{ .Values.auth.session.ttl }}
            {{- if eq .Values.auth.mode "token" }}
            - --auth-admin-token-file=/var/run/pagerless/auth/admin/token
            - --auth-session-key-file=/var/run/pagerless/auth/session/session-key
            {{- end }}
            - --credentials-secret={{ .Values.credentials.secretName }}
            - --credentials-external-manager={{ .Values.credentials.existingSecret }}
            - --credentials-mount-path={{ .Values.credentials.mountPath }}
          envFrom:
            - configMapRef:
                name: pagerless-config
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: report
              containerPort: {{ .Values.service.reportPort }}
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: credentials
              mountPath: {{ .Values.credentials.mountPath }}
              readOnly: true
            {{- if eq .Values.auth.mode "token" }}
            - name: admin-token
              mountPath: /var/run/pagerless/auth/admin
              readOnly: true
            - name: session-key
              mountPath: /var/run/pagerless/auth/session
              readOnly: true
            {{- end }}
            - name: connectors
              mountPath: /etc/pagerless/connectors
              readOnly: true
            - name: data
              mountPath: /var/lib/pagerless
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: credentials
          secret:
            secretName: {{ include "pagerless.credentialsSecret" . }}
        {{- if eq .Values.auth.mode "token" }}
        - name: admin-token
          secret:
            secretName: {{ .Values.auth.adminSecret.name }}
            items:
              - key: {{ .Values.auth.adminSecret.key }}
                path: token
        - name: session-key
          secret:
            secretName: {{ .Values.auth.session.secretName }}
            items:
              - key: {{ .Values.auth.session.key }}
                path: session-key
        {{- end }}
        - name: connectors
          configMap:
            name: pagerless-connectors
        - name: data
          persistentVolumeClaim:
            claimName: pagerless-data
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
