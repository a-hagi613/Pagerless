{{- /*
pagerless-server is the only long-running process: the Page reconcilers, the
agent report API, and the metrics API. It runs one replica with the Recreate
strategy because it is the single writer of Page status (ADR-0001, ADR-0030).

No admission webhook is served, so there is no serving certificate, no
certificate bootstrap, and no webhook port (ADR-0037).
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagerless-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pagerless-server
  template:
    metadata:
      labels:
        {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: {{ include "pagerless.image" (dict "context" $ "image" .Values.images.server) }}
          imagePullPolicy: {{ .Values.images.server.pullPolicy }}
          args:
            - --namespace=$(POD_NAMESPACE)
            - --agent-image={{ include "pagerless.image" (dict "context" $ "image" .Values.images.agent) }}
            - --report-url=http://pagerless-server.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}
            - --report-bind-address=:{{ .Values.service.port }}
            - --metrics-bind-address=:9090
            - --health-probe-bind-address=:8081
            - --history-path=/var/lib/pagerless/history.db
            - --target-namespaces={{ include "pagerless.allowlist" . }}
            - --patch-namespaces={{ include "pagerless.allowlist" . }}
            - --alert-namespaces={{ include "pagerless.allowlist" . }}
            - --sandbox-url=
            - --argocd-url=
            - --alertmanager-url=
            # The Portal and its sign-in are delivered with the auth and Portal
            # slices; this chart shell serves the report and metrics APIs only.
            - --dashboard-bind-address=
          envFrom:
            - configMapRef:
                name: pagerless-config
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: credentials
              mountPath: {{ .Values.credentials.mountPath }}
              readOnly: true
            - name: data
              mountPath: /var/lib/pagerless
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: credentials
          secret:
            secretName: {{ include "pagerless.credentialsSecret" . }}
        - name: data
          persistentVolumeClaim:
            claimName: pagerless-data
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
