apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-server" (include "pagerless.fullname" .) }}
  labels:
    {{- include "pagerless.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pagerless.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "pagerless.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: {{ include "pagerless.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: {{ include "pagerless.serverImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PAGERLESS_LISTEN_ADDR
              value: ":{{ .Values.service.port }}"
            - name: PAGERLESS_DATA_DIR
              value: /var/lib/pagerless
            - name: PAGERLESS_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: PAGERLESS_OPERATOR_TOKEN_FILE
              value: /var/run/pagerless/secret/operator-token
            - name: PAGERLESS_INTERNAL_TOKEN_FILE
              value: /var/run/pagerless/secret/internal-token
            - name: PAGERLESS_MCP_TOKEN_FILE
              value: /var/run/pagerless/secret/mcp-token
            - name: PAGERLESS_AGENT_URL
              value: {{ default (printf "http://%s:%v" (include "pagerless.agentServiceName" .) .Values.agent.port) .Values.agent.url | quote }}
            - name: PAGERLESS_CALLBACK_ORIGIN
              value: {{ printf "http://%s-server:%v" (include "pagerless.fullname" .) .Values.service.port | quote }}
            {{- if .Values.kubernetes.enabled }}
            - name: PAGERLESS_KUBERNETES_MCP_URL
              value: {{ printf "http://%s:%v/mcp" (include "pagerless.kubernetesMCPServiceName" .) .Values.mcp.port | quote }}
            {{- end }}
            - name: PAGERLESS_GITHUB_MCP_URL
              value: {{ printf "http://%s:%v/mcp" (include "pagerless.githubMCPServiceName" .) .Values.mcp.port | quote }}
            - name: PAGERLESS_GITHUB_REPOSITORY
              value: {{ required "github.repository must name the repository that owns the cluster's source" .Values.github.repository | quote }}
            - name: PAGERLESS_GITHUB_BASE_BRANCH
              value: {{ .Values.github.baseBranch | quote }}
            - name: PAGERLESS_GITHUB_PATH_PREFIX
              value: {{ .Values.github.pathPrefix | quote }}
            - name: PAGERLESS_GITHUB_API_URL
              value: {{ .Values.github.apiUrl | quote }}
            - name: PAGERLESS_GITHUB_READ_TOKEN_FILE
              value: /var/run/pagerless/secret/github-read-token
            - name: PAGERLESS_GITHUB_WRITE_TOKEN_FILE
              value: /var/run/pagerless/secret/github-write-token
            - name: PAGERLESS_TRIGGER_TOKEN_FILE
              value: /var/run/pagerless/trigger/trigger-token
            {{- if .Values.observability.prometheus.enabled }}
            - name: PAGERLESS_PROMETHEUS_MCP_URL
              value: {{ printf "http://%s:%v/mcp" (include "pagerless.prometheusMCPServiceName" .) .Values.mcp.port | quote }}
            {{- end }}
            {{- if .Values.observability.grafana.enabled }}
            - name: PAGERLESS_GRAFANA_MCP_URL
              value: {{ printf "http://%s:%v/mcp" (include "pagerless.grafanaMCPServiceName" .) .Values.mcp.port | quote }}
            {{- end }}
            - name: PAGERLESS_NAMESPACE_ALLOWLIST
              value: {{ join "," .Values.kubernetes.namespaceAllowlist | quote }}
            - name: PAGERLESS_RETENTION
              value: {{ .Values.retention | quote }}
            - name: PAGERLESS_TURN_TIMEOUT
              value: {{ .Values.turnTimeout | quote }}
            - name: PAGERLESS_TOOL_TIMEOUT
              value: {{ .Values.toolTimeout | quote }}
            - name: PAGERLESS_STOP_GRACE
              value: {{ .Values.stopGrace | quote }}
            - name: PAGERLESS_MAX_ACTIVE_TURNS
              value: {{ .Values.maxActiveTurns | quote }}
            - name: PAGERLESS_MAX_TOOL_CALLS
              value: {{ .Values.maxToolCalls | quote }}
            - name: PAGERLESS_MAX_RESULT_BYTES
              value: {{ .Values.maxResultBytes | quote }}
            - name: PAGERLESS_BUDGET_TOOL_CALLS
              value: {{ .Values.agent.budget.toolCalls | quote }}
            - name: PAGERLESS_BUDGET_MODEL_CALLS
              value: {{ .Values.agent.budget.modelCalls | quote }}
            - name: PAGERLESS_BUDGET_INPUT_TOKENS
              value: {{ .Values.agent.budget.inputTokens | quote }}
            - name: PAGERLESS_BUDGET_SECONDS
              value: {{ .Values.agent.budget.seconds | quote }}
          volumeMounts:
            {{- include "pagerless.credentialsMount" . | nindent 12 }}
            - name: transcript
              mountPath: /var/lib/pagerless
            - name: tmp
              mountPath: /tmp
            - name: trigger
              mountPath: /var/run/pagerless/trigger
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        {{- include "pagerless.credentialsVolume" . | nindent 8 }}
        - name: transcript
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-transcript" (include "pagerless.fullname" .)) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        - name: trigger
          secret:
            secretName: {{ required "existingSecret must name the externally provisioned credentials Secret" .Values.existingSecret }}
            optional: true
            defaultMode: 0400
            items:
              - key: trigger-token
                path: trigger-token
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
