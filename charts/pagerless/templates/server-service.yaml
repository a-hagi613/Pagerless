apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-server" (include "pagerless.fullname" .) }}
  labels:
    {{- include "pagerless.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "pagerless.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pagerless.agentServiceName" . }}
  labels:
    {{- include "pagerless.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  selector:
    {{- include "pagerless.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  ports:
    - name: http
      port: {{ .Values.agent.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.kubernetes.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pagerless.kubernetesMCPServiceName" . }}
  labels:
    {{- include "pagerless.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubernetes-mcp
spec:
  type: ClusterIP
  selector:
    {{- include "pagerless.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kubernetes-mcp
  ports:
    - name: http
      port: {{ .Values.mcp.port }}
      targetPort: http
      protocol: TCP
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pagerless.githubMCPServiceName" . }}
  labels:
    {{- include "pagerless.labels" . | nindent 4 }}
    app.kubernetes.io/component: github-mcp
spec:
  type: ClusterIP
  selector:
    {{- include "pagerless.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: github-mcp
  ports:
    - name: http
      port: {{ .Values.mcp.port }}
      targetPort: http
      protocol: TCP
