apiVersion: v1
kind: Service
metadata:
  name: pagerless-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: pagerless-server
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
