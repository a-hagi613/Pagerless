{{- /*
Bundled read-only MCP servers. Images are pinned by digest exactly as in
deploy/mcp/values.yaml, and each container keeps the restricted security
context and the args of that chart. agentgateway calls these servers (ADR-0022);
the agent never does. Disable mcp.bundled.enabled when the cluster already
provides them.
*/ -}}
{{- if .Values.mcp.bundled.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-kubernetes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-mcp") | nindent 4 }}
data:
  config.toml: |
    port = "8080"
    bind_address = "0.0.0.0"
    read_only = true
    list_output = "yaml"
    toolsets = ["core"]
    enabled_tools = ["resources_get", "resources_list", "pods_get", "pods_list_in_namespace", "pods_log", "events_list"]
    max_result_bytes = 1048576
    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "Secret"
---
# The Kubernetes MCP server authorizes with this read-only ServiceAccount, so it
# is the only bundled server that mounts an API token. Its Role lives in each
# Workload namespace (rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-kubernetes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-mcp") | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-kubernetes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-mcp") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: mcp-kubernetes
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-kubernetes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-mcp") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-kubernetes
  template:
    metadata:
      labels:
        {{- include "pagerless.labels" (dict "context" $ "name" "mcp-kubernetes") | nindent 8 }}
    spec:
      serviceAccountName: mcp-kubernetes
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: "quay.io/containers/kubernetes_mcp_server:v0.1.3@sha256:6347155616c49c78512114500688b50d275ddde7597b6a38cefe6f40a8c42c16"
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/mcp/config.toml"]
          ports:
            - name: mcp
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: mcp
          livenessProbe:
            tcpSocket:
              port: mcp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/mcp
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mcp-kubernetes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-mcp") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-mcp") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: mcp-grafana
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-grafana
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-mcp") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-grafana
  template:
    metadata:
      labels:
        {{- include "pagerless.labels" (dict "context" $ "name" "mcp-grafana") | nindent 8 }}
    spec:
      serviceAccountName: mcp-grafana
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: "docker.io/grafana/mcp-grafana:2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed"
          imagePullPolicy: IfNotPresent
          args:
            - -t
            - streamable-http
            - --address
            - :8000
            - --allowed-hosts=mcp-grafana.{{ .Release.Namespace }}.svc,mcp-grafana.{{ .Release.Namespace }}.svc:8000,mcp-grafana.{{ .Release.Namespace }}.svc.cluster.local,mcp-grafana.{{ .Release.Namespace }}.svc.cluster.local:8000,mcp-gateway.agentgateway-system.svc.cluster.local,mcp-gateway.agentgateway-system.svc.cluster.local:80
            - --disable-write
            - --enable-query
            - --enabled-tools=datasource,prometheus,loki,tempo
          env:
            - name: GRAFANA_URL
              value: {{ .Values.grafana.mcpUrl | quote }}
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.mcp.backendTokensSecretName }}, key: grafana}
            - name: MCP_GRAFANA_SERVER_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.mcp.clientTokensSecretName }}, key: grafana}
          ports:
            - name: mcp
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: mcp
          livenessProbe:
            tcpSocket:
              port: mcp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-argocd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-mcp") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-argocd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-mcp") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: mcp-argocd
  ports:
    - name: mcp
      port: 3000
      targetPort: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-argocd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-mcp") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-argocd
  template:
    metadata:
      labels:
        {{- include "pagerless.labels" (dict "context" $ "name" "mcp-argocd") | nindent 8 }}
    spec:
      serviceAccountName: mcp-argocd
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: "ghcr.io/argoproj-labs/mcp-for-argocd:0.9.0@sha256:dffc6c719d8635be2d5f2c8ad1c0178540325da4b40da0b373307e12b4c48f86"
          imagePullPolicy: IfNotPresent
          args: ["http", "--stateless", "--bind-address", "0.0.0.0"]
          env:
            - name: ARGOCD_BASE_URL
              value: {{ .Values.argocd.url | quote }}
            - name: ARGOCD_API_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.argocd.secretName }}, key: token}
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.mcp.clientTokensSecretName }}, key: argocd}
            - name: MCP_READ_ONLY
              value: "true"
          ports:
            - name: mcp
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: mcp
          livenessProbe:
            tcpSocket:
              port: mcp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-github
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-mcp") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
