    - name: mcp
      port: 8082
      targetPort: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-github
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-mcp") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-github
  template:
    metadata:
      labels:
        {{- include "pagerless.labels" (dict "context" $ "name" "mcp-github") | nindent 8 }}
    spec:
      serviceAccountName: mcp-github
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: "ghcr.io/github/github-mcp-server:v2.2.0@sha256:040c4e99810076035eb1d9beb4b4a96fcf589c43cefed6ff51a46a553eb4e174"
          imagePullPolicy: IfNotPresent
          args: ["http", "--port", "8082", "--read-only", "--toolsets=", "--tools=list_commits,get_commit,get_file_contents"]
          {{- with .Values.mcp.githubHost }}
          env:
            - name: GITHUB_HOST
              value: {{ . | quote }}
          {{- end }}
          ports:
            - name: mcp
              containerPort: 8082
          readinessProbe:
