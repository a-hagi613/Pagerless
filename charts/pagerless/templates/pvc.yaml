{{- /*
The append-only Page history. The server appends one status snapshot per Phase
change and never rewrites one, so the PVC keeps the audit trail across a pod
restart and a Page's deletion.
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pagerless-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
