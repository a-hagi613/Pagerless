{{- /*
Empty placeholder Secrets for the optional integrations, rendered only when
secrets.createPlaceholders is true. They let the control plane and the bundled
MCP servers start before a GitHub token, an Argo CD token, or Grafana service
account token exists, as the live-only installer path does. The real values are
provisioned by an external secret manager or by hack/install.sh, which keeps
this option false.

The OIDC client secrets (oidc.secretName), the inference credentials
(pagerless-agent-credentials), and the Alertmanager webhook token
(alertmanager.secretName) are never placeholders: they configure identities or
authentication, not an optional integration.
*/ -}}
{{- if .Values.secrets.createPlaceholders }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.sandbox.readSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless") | nindent 4 }}
type: Opaque
stringData:
  token: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.sandbox.writeSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless") | nindent 4 }}
type: Opaque
stringData:
  token: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.argocd.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless") | nindent 4 }}
type: Opaque
stringData:
  token: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mcp.backendTokensSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless") | nindent 4 }}
type: Opaque
stringData:
  grafana: ""
---
# mcp-kubernetes authenticates with its own ServiceAccount rather than a token,
# so the backend Secret has no key for it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mcp.clientTokensSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless") | nindent 4 }}
type: Opaque
stringData:
  grafana: ""
  argocd: ""
  github: ""
{{- end }}
