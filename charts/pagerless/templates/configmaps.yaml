{{- /*
Two ConfigMaps, both non-secret. pagerless-config holds the small amount of
server configuration that is worth naming separately from the Deployment's
arguments, and pagerless-connectors holds the Connector catalogue the operator
configures. Credentials never appear here; they live in the credentials Secret
and are referenced by key (ADR-0040).
*/ -}}
{{- if ne (dig "logs" "nativeKubernetes" "enabled" true .Values.connectors) true }}
{{- fail "connectors.logs.nativeKubernetes.enabled must stay true: native Kubernetes logs are the only evidence source that needs no external service" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: pagerless-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 4 }}
data:
  PAGERLESS_DASHBOARD_BASE_URL: {{ .Values.dashboard.baseUrl | quote }}
  PAGERLESS_ALLOWED_NAMESPACES: {{ include "pagerless.allowlist" . | quote }}
  # Read by `kubectl page config` in kubeconfig mode, so the CLI writes the
  # Secret the Deployment mounts and refuses a Secret an external manager owns.
  PAGERLESS_CREDENTIALS_SECRET: {{ include "pagerless.credentialsSecret" . | quote }}
  PAGERLESS_CREDENTIALS_EXTERNAL_MANAGER: {{ .Values.credentials.existingSecret | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pagerless-connectors
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-server") | nindent 4 }}
data:
  connectors.yaml: |
    {{- toYaml .Values.connectors | nindent 4 }}
