{{- /*
ConfigMaps read by pagerless-server and the agent Job. The
values are the ones hack/install.sh and the local bootstrap also write, so both
installation paths describe the same integrations.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: pagerless-sandbox
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-sandbox") | nindent 4 }}
data:
  # Empty selects live-only RestartWorkload and NoAction remediation.
  url: {{ .Values.sandbox.url | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pagerless-agent-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pagerless.labels" (dict "context" $ "name" "pagerless-agent") | nindent 4 }}
data:
  PAGERLESS_MODEL_PROVIDER: {{ .Values.agent.provider | quote }}
  PAGERLESS_MCP_GATEWAY_URL: {{ .Values.mcp.gatewayUrl | quote }}
  PAGERLESS_MCP_SERVERS: {{ include "pagerless.mcpServers" . | quote }}
  PAGERLESS_KEYCLOAK_ISSUER: {{ .Values.oidc.issuer | quote }}
  PAGERLESS_KEYCLOAK_TOKEN_URL: {{ include "pagerless.oidcTokenUrl" . | quote }}
  PAGERLESS_KEYCLOAK_CLIENT_ID: {{ .Values.oidc.agentClientId | quote }}
  PAGERLESS_REPLAY_FILE: {{ .Values.agent.replayFile | quote }}
  PAGERLESS_NARRATIVE_REPLAY_FILE: {{ .Values.agent.narrativeReplayFile | quote }}
  PAGERLESS_SANDBOX_OWNER: {{ include "pagerless.sandboxOwner" . | quote }}
  PAGERLESS_SANDBOX_REPO: {{ include "pagerless.sandboxRepo" . | quote }}
  PAGERLESS_ARGOCD_APPLICATION: {{ .Values.argocd.application | quote }}
  PAGERLESS_ALLOWED_NAMESPACES: {{ include "pagerless.workloadNamespaces" . | quote }}
  PAGERLESS_SANDBOX_URL: {{ .Values.sandbox.url | quote }}
  {{- with .Values.agent.awsRegion }}
  AWS_REGION: {{ . | quote }}
  {{- end }}
