# Rendered by scripts/release/render-krew-manifest.sh from a release's checksum
# file. The committed copy cannot carry checksums before the first release
# exists, so it is the template: the release job renders it from
# dist/checksums.txt, publishes the rendered file as the page.yaml asset, and
# refreshes this file. Install a rendered copy, never this template: the
# release lint rejects the ${...} placeholders below.
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: page
spec:
  version: v${VERSION}
  homepage: https://github.com/a-hagi613/pagerless
  shortDescription: Ask why a Kubernetes workload is failing and follow the evidence
  description: |
    kubectl page opens an investigation from a terminal question and streams the
    agent's tool calls, cited evidence, and answer. It uses the same API and
    conversation history as the dashboard. Ctrl-C detaches from the stream and
    leaves the turn running; stopping a turn is an explicit command.
  caveats: |
    Pagerless must already be installed in the cluster. Install the chart with
    helm install pagerless oci://ghcr.io/a-hagi613/pagerless/core/charts/pagerless
    --namespace pagerless --create-namespace, then run kubectl page --help.
    The plugin discovers the installed Service through the current kube context
    and forwards a local port; pass --address to use a reachable address
    directly. Export the operator token as PAGERLESS_TOKEN or pass
    --token-file. The token is never a flag value and never appears in a URL.
  platforms:
    - bin: kubectl-page
      uri: ${BASE_URL}/kubectl-page_${VERSION}_linux_amd64.tar.gz
      sha256: ${SHA256_LINUX_AMD64}
      selector:
        matchLabels:
          os: linux
          arch: amd64
    - bin: kubectl-page
      uri: ${BASE_URL}/kubectl-page_${VERSION}_linux_arm64.tar.gz
      sha256: ${SHA256_LINUX_ARM64}
      selector:
        matchLabels:
          os: linux
          arch: arm64
    - bin: kubectl-page
      uri: ${BASE_URL}/kubectl-page_${VERSION}_darwin_amd64.tar.gz
      sha256: ${SHA256_DARWIN_AMD64}
      selector:
        matchLabels:
          os: darwin
          arch: amd64
    - bin: kubectl-page
      uri: ${BASE_URL}/kubectl-page_${VERSION}_darwin_arm64.tar.gz
      sha256: ${SHA256_DARWIN_ARM64}
      selector:
        matchLabels:
          os: darwin
          arch: arm64
